<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Aetherwake Character Identity Evidence</title>
<style>
html,body{margin:0;padding:0;background:#0e1421;overflow:hidden;width:100%;height:100%}
canvas{display:block;width:1440px!important;height:960px!important;image-rendering:pixelated}
</style>
<script src="../p5.min.js"></script>
<script src="../modules/character-renderer.js"></script>
</head>
<body>
<script>
function setup(){
  createCanvas(960,640);
  pixelDensity(1);
  noLoop();
  background(14,20,33);
  noStroke();
  fill(28,41,55); rect(0,0,width,height);
  fill(42,255,181,38); rect(0,70,width,2);
  fill(232,220,198); textAlign(CENTER,TOP); textFont('Segoe UI Semibold'); textSize(24);
  text('AETHERWAKE // CHARACTER IDENTITY REVIEW',width/2,24);
  const ids=['reson','aepex','ender','lyra','ionia'];
  const labels=['RESON','AEPEX','ENDER','LYRA','IONIA'];
  const xs=[110,295,480,665,850];
  for(let i=0;i<ids.length;i++){
    fill(9,13,24,205); rect(xs[i]-76,92,152,474,8);
    fill(42,255,181,45); rect(xs[i]-66,104,132,2);
    AetherCharacterRenderer.drawPortrait(ids[i],xs[i],245,{scale:2.6,now:2200,action:'idle'});
    AetherCharacterRenderer.draw(ids[i],xs[i],485,{scale:3.0,depth:0.72,now:2200,speed:0,facing:'right',action:'idle'});
    fill(232,220,198); textAlign(CENTER,TOP); textSize(14); text(labels[i],xs[i],530);
  }
  fill(124,200,232,180); textSize(11);
  text('DIAGNOSTIC // portrait + field silhouette // reference-backed runtime authority',width/2,594);
  window.__identityEvidenceReady=true;
}
</script>
</body>
</html>
