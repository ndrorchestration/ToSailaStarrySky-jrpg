<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ender Field Sprite Candidate</title>
<style>
:root{color-scheme:dark;font:16px system-ui,sans-serif;background:#0e1719;color:#eff4e8}
body{margin:0;min-height:100vh;display:grid;place-items:center}
main{width:min(92vw,720px);padding:32px;border:1px solid #536357;border-radius:18px;background:#172323;box-shadow:0 18px 56px #0008}
h1{margin:0 0 8px;color:#e9d6af;font-size:1.5rem}
p{color:#becaba;line-height:1.5}
figure{margin:24px auto;width:max-content;padding:24px;background-color:#273632;background-image:linear-gradient(45deg,#33443e 25%,transparent 25%,transparent 75%,#33443e 75%),linear-gradient(45deg,#33443e 25%,transparent 25%,transparent 75%,#33443e 75%);background-size:20px 20px;background-position:0 0,10px 10px;border:1px solid #81917e;border-radius:8px}
canvas{display:block;width:336px;height:432px;image-rendering:pixelated;image-rendering:crisp-edges}
button{border:1px solid #a6b88e;border-radius:8px;background:#2d493c;color:#fff;padding:10px 16px;font:inherit;cursor:pointer}
small{display:block;margin-top:16px;color:#a7b5a4}
</style>
<main>
<h1>Ender · Field Sprite Candidate</h1>
<p>Derived from the selected Ender reference. This two-frame idle/walk candidate is opt-in and does not replace runtime art.</p>
<figure><canvas id="sprite" width="28" height="36" aria-label="Ender pixel-art sprite"></canvas></figure>
<button id="toggle" type="button">Pause animation</button>
<small>56 × 36 transparent atlas · 28 × 36 per frame · candidate</small>
</main>
<script>
const canvas=document.getElementById('sprite'),ctx=canvas.getContext('2d');
const atlas=new Image();atlas.src='../assets/characters/v1/ender/field-idle-walk-candidate.png';
let frame=0,playing=true;
atlas.onload=()=>{ctx.imageSmoothingEnabled=false;draw();setInterval(()=>{if(playing){frame=1-frame;draw()}},450)};
function draw(){ctx.clearRect(0,0,28,36);ctx.drawImage(atlas,frame*28,0,28,36,0,0,28,36)}
document.getElementById('toggle').onclick=event=>{playing=!playing;event.currentTarget.textContent=playing?'Pause animation':'Play animation';if(!playing){frame=0;draw()}};
</script></html>
