<!doctype html>
<meta charset="utf-8">
<title>Aetherwake — Five-Protagonist Field Sprite Candidate Review</title>
<style>
  :root { color-scheme: dark; font-family: Segoe UI, system-ui, sans-serif; background:#09131b; color:#e8f5ef; }
  body { max-width:1100px; margin:32px auto; padding:0 24px; }
  h1 { color:#2affb5; letter-spacing:.04em; }
  p { color:#9fc7c2; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px; }
  article { background:#11222b; border:1px solid #27545a; border-radius:12px; padding:14px; }
  canvas { width:224px; height:144px; image-rendering:pixelated; background:repeating-conic-gradient(#142b31 0 25%,#102128 0 50%) 0/20px 20px; border-radius:8px; }
  .meta { color:#75b7b1; font-size:13px; margin-top:8px; }
</style>
<h1>Field Sprite Candidate Review</h1>
<p>Candidate-only review for the five authored protagonists. Each card shows idle and walk frames at 4× scale. This page does not change runtime admission.</p>
<div class="grid" id="grid"></div>
<script>
const roster = [
  ['Ender','ender'],['Lyra','lyra'],['Ionia','ionia'],['Aepex','aepex'],['Reson','reson']
];
const grid = document.querySelector('#grid');
for (const [name,id] of roster) {
  const card=document.createElement('article');
  card.innerHTML='<h2>'+name+'</h2><canvas width="224" height="144"></canvas><div class="meta">idle · walk · candidate</div>';
  grid.append(card);
  const ctx=card.querySelector('canvas').getContext('2d');
  ctx.imageSmoothingEnabled=false;
  const img=new Image();
  img.onload=()=>{ ctx.clearRect(0,0,224,144); ctx.drawImage(img,0,0,28,36,0,0,112,144); ctx.drawImage(img,28,0,28,36,112,0,112,144); };
  img.onerror=()=>{ ctx.fillStyle='#ffb347'; ctx.fillText('candidate unavailable',12,72); };
  img.src='../../assets/characters/v1/'+id+'/field-idle-walk-candidate.png';
}
</script>
