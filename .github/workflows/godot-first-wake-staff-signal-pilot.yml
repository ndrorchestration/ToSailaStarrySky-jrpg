name: Godot First Wake event-driven staff visual pilot
on:
  push:
    branches: [feat/godot-first-wake-visual-event-pilot-20261027]
    paths:
      - 'godot/scripts/first_wake_chapter1_review.gd'
      - 'godot/scripts/first_wake_staff_signal_visual_presenter.gd'
      - 'godot/scripts/first_wake_staff_signal_pilot_review.gd'
      - 'godot/scenes/first_wake_staff_signal_pilot_review.tscn'
      - 'godot/tests/first_wake_staff_signal_pilot_test.gd'
      - 'godot/tests/capture_first_wake_staff_signal_pilot.gd'
      - '.github/workflows/godot-first-wake-staff-signal-pilot.yml'
  pull_request:
    paths:
      - 'godot/scripts/first_wake_chapter1_review.gd'
      - 'godot/scripts/first_wake_staff_signal_visual_presenter.gd'
      - 'godot/scripts/first_wake_staff_signal_pilot_review.gd'
      - 'godot/scenes/first_wake_staff_signal_pilot_review.tscn'
      - 'godot/tests/first_wake_staff_signal_pilot_test.gd'
      - 'godot/tests/capture_first_wake_staff_signal_pilot.gd'
      - '.github/workflows/godot-first-wake-staff-signal-pilot.yml'
permissions:
  contents: read
jobs:
  native-live-staff-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Download official digest-verified Godot 4.7.2 standard editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o editor.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  editor.zip' | sha256sum -c -
          unzip -q editor.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import exact-head native project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Run existing Chapter I, formula, authority and weapon pipeline regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in first_wake_chapter1_review_test first_wake_party_combat_authority_test first_wake_formula_encounter_test first_wake_staff_visual_pipeline_test weapon_skill_tree_review_test weapon_battle_visual_adapter_test ender_staff_combat_keyframe_review_test ender_staff_target_alignment_review_test; do
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script "res://tests/${test}.gd"
          done
      - name: Verify actual action-result signal and opt-in scene playback
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_staff_signal_pilot_test.gd
      - name: Capture genuine First Wake scene with active optional staff visual
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          mkdir -p godot/review-evidence
          xvfb-run -a -s "-screen 0 960x640x24" ./Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_first_wake_staff_signal_pilot.gd
          for shot in before-authorized-action staff-action-visual-contact staff-action-reduced-motion; do
            test -s "godot/review-evidence/first-wake-event-${shot}-960x640.png"
          done
          sha256sum godot/review-evidence/first-wake-event-*-960x640.png
          echo "DEFAULT_GAME_SCENE_CHANGED=FALSE"
          echo "ACTUAL_COMBAT_DISPATCH=EXISTING_FIRST_WAKE_ONLY"
          echo "SIGNAL_CAN_EXECUTE_COMBAT=FALSE"
          echo "SAVE_SCHEMA_CHANGED=FALSE"
          echo "ART_ACCEPTANCE=NOT_ESTABLISHED"
