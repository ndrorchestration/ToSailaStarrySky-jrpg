name: First Wake Source-Exact Ship Geometry Cross-Study (review only)

on:
  pull_request:
    paths:
      - "godot/scripts/ship_foredeck_cross_study.gd"
      - "godot/scripts/ship_geodesic_bridge_cross_study.gd"
      - "godot/scripts/ship_cross_study_clearance_contract.gd"
      - "godot/scripts/ship_wing_dome_triangle_probe.gd"
      - "godot/tests/first_wake_wing_dome_triangle_probe_test.gd"
      - "godot/scripts/first_wake_ship_pose_3d_review.gd"
      - "godot/shaders/bridge_panorama_glass.gdshader"
      - "godot/tests/first_wake_cross_study_clearance_test.gd"
      - "godot/tests/capture_first_wake_cross_study.gd"
      - ".github/workflows/godot-first-wake-cross-study.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry-cross-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout pinned public-safe candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Download and verify official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL \
            "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" \
            -o /tmp/godot.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip" | sha256sum -c -
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import independent native Chapter I project and cross-study geometry
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path godot --editor --quit 2>&1 | tee /tmp/cross-import.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|Failed loading' /tmp/cross-import.log
      - name: Native real Chapter I deck-dome-wing geometry admission contract
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path godot --script res://tests/first_wake_cross_study_clearance_test.gd \
            2>&1 | tee /tmp/cross-native.log
          grep -Eq 'FIRST_WAKE_CROSS_STUDY_PASS checks=[0-9]+' /tmp/cross-native.log
          grep -q 'FIRST_WAKE_CROSS_STUDY_NUMERIC:' /tmp/cross-native.log
          ! grep -Eq 'FIRST_WAKE_CROSS_STUDY_FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/cross-native.log
      - name: Native narrow phase original membrane versus glass triangle probe
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path godot --script res://tests/first_wake_wing_dome_triangle_probe_test.gd \
            2>&1 | tee /tmp/wing-dome-triangle.log
          grep -Eq 'FIRST_WAKE_TRIANGLE_PROBE_PASS checks=[0-9]+' /tmp/wing-dome-triangle.log
          grep -q 'FIRST_WAKE_TRIANGLE_PROBE_REPORT:' /tmp/wing-dome-triangle.log
          ! grep -Eq 'FIRST_WAKE_TRIANGLE_PROBE_FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/wing-dome-triangle.log
      - name: Inherit real three-dimensional wing, pose, and story/save contracts
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path godot --script res://tests/first_wake_native_wing_render_test.gd \
            2>&1 | tee /tmp/cross-wing-regression.log
          grep -q 'FIRST_WAKE_NATIVE_WING_RENDER_PASS checks=43' /tmp/cross-wing-regression.log
          timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path godot --script res://tests/first_wake_ship_pose_port_test.gd \
            2>&1 | tee /tmp/cross-pose-regression.log
          grep -q 'FIRST_WAKE_SHIP_POSE_PORT_PASS checks=38' /tmp/cross-pose-regression.log
          timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless \
            --path godot --script res://tests/first_wake_ship_space_handoff_test.gd \
            2>&1 | tee /tmp/cross-spaces-regression.log
          grep -q 'FIRST_WAKE_SHIP_SPACE_HANDOFF_PASS checks=32' /tmp/cross-spaces-regression.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/cross-wing-regression.log /tmp/cross-pose-regression.log /tmp/cross-spaces-regression.log
      - name: Capture matched native Godot four-view original/assembled/moving evidence
        shell: bash
        run: |
          set -euo pipefail
          timeout 150s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --path godot \
            --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/capture_first_wake_cross_study.gd \
            2>&1 | tee /tmp/cross-gl.log
          test "$(grep -c 'FIRST_WAKE_CROSS_STUDY_CAPTURE:' /tmp/cross-gl.log)" -eq 4
          grep -q 'FIRST_WAKE_CROSS_STUDY_AB_PASS frames=4' /tmp/cross-gl.log
          ! grep -Eq 'FIRST_WAKE_CROSS_STUDY_CAPTURE_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/cross-gl.log
      - name: Preserve only review evidence and test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-wake-source-exact-geometry-cross-study
          path: |
            godot/review-evidence/ship-geometry-cross-study/*.png
            /tmp/cross-import.log
            /tmp/cross-native.log
            /tmp/wing-dome-triangle.log
            /tmp/cross-wing-regression.log
            /tmp/cross-pose-regression.log
            /tmp/cross-spaces-regression.log
            /tmp/cross-gl.log
          if-no-files-found: warn
          retention-days: 7
