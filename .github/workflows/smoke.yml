name: Aetherwake smoke

on:
  push:
    branches:
      - main
      - dev/progression-build
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: aetherwake-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Verify runtime contract
        run: npm run test:runtime-contracts

      - name: Verify runtime authority
        run: npm run test:runtime-authority

      - name: Verify pixel sprite foundation
        run: npm run test:pixel-sprites

      - name: Verify pixel tile foundation
        run: npm run test:pixel-tiles

      - name: Verify pixel world ambient conversion
        run: npm run test:pixel-world-ambient

      - name: Verify target JRPG combat policy
        run: npm run test:combat-policy

      - name: Verify JRPG combat formula resolver
        run: npm run test:combat-formula

      - name: Verify Memories-style JRPG input authority
        run: npm run test:jrpg-input

      - name: Verify complete JRPG control surface
        run: npm run test:jrpg-controls

      - name: Verify authored onboarding contract
        run: npm run test:onboarding

      - name: Verify save-state contract
        run: npm run test:save-state

      - name: Verify mastery definitions
        run: npm run test:mastery

      - name: Verify magic school access boundary
        run: npm run test:magic-access

      - name: Verify Aether Sense runtime
        run: npm run test:aether-sense

      - name: Verify foundation spell admission
        run: npm run test:foundation-spell-admission

      - name: Verify preservation field-role definitions
        run: npm run test:field-roles

      - name: Verify read-only party combat bridge
        run: npm run test:party-combat-bridge

      - name: Verify companion action admission contract
        run: npm run test:companion-action-admission

      - name: Verify companion action contract drafts
        run: npm run test:companion-action-contracts

      - name: Verify regression contracts
        run: npm run test:regressions

      - name: Verify airship state contract
        run: npm run test:airship

      - name: Verify air navigation
        run: npm run test:air-navigation

      - name: Verify air navigation runtime
        run: npm run test:air-navigation-runtime

      - name: Verify sky combat runtime
        run: npm run test:sky-combat

      - name: Verify airship combat bridge contract
        run: npm run test:airship-combat-bridge

      - name: Verify effect vocabulary contract
        run: npm run test:effects

      - name: Verify ability/progression registries
        run: npm run test:registries

      - name: Verify effect resolver contract
        run: npm run test:resolver

      - name: Verify live resolver integration
        run: npm run test:resolver-integration

      - name: Verify enemy metadata propagation
        run: npm run test:enemy-metadata

      - name: Verify combat input/log contract
        run: npm run test:combat-input

      - name: Verify resource/use eligibility
        run: npm run test:resource-eligibility

      - name: Verify progression reachability
        run: npm run test:progression-reachability

      - name: Verify secondary-action state
        run: npm run test:secondary-action

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: npm run test:smoke

