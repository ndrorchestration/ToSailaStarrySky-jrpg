name: Aetherwake smoke

on:
  push:
    branches:
      - main
      - dev/progression-build
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/ISSUE_TEMPLATE/**'
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Verify CI trigger hygiene
        run: npm run test:ci-trigger-hygiene

      - name: Verify Visual Package v1 integration
        run: npm run test:visual-package-integration

      - name: Verify Preview world presentation
        run: npm run test:preview-world-presentation
      - name: Verify lore tile initialization
        run: npm run test:world-lore-map

      - name: Verify crossing hazards require combat
        run: npm run test:crossing-hazard-combat

      - name: Verify hazard markers match live zones
        run: npm run test:hazard-marker-alignment

      - name: Verify world-entry onboarding
        run: npm run test:world-entry-onboarding

      - name: Verify WAKE transition pacing
        run: npm run test:wake-transition-pacing

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify persistence foundation
        run: npm run test:persistence-foundation

      - name: Verify effect vocabulary contract
        run: npm run test:effects

      - name: Verify ability/progression registries
        run: npm run test:registries

      - name: Verify effect resolver contract
        run: npm run test:resolver

      - name: Verify live resolver integration
        run: npm run test:resolver-integration

      - name: Verify enemy metadata propagation
        run: npm run test:enemy-metadata

      - name: Verify combat runtime bridge
        run: npm run test:combat-runtime

      - name: Verify combat input/log contract
        run: npm run test:combat-input

      - name: Verify resource/use eligibility
        run: npm run test:resource-eligibility

      - name: Verify progression reachability
        run: npm run test:progression-reachability

      - name: Verify long-form progression curve
        run: npm run test:longform-progression

      - name: Verify encounter scaling contract
        run: npm run test:encounter-scaling

      - name: Verify party capacity contract
        run: npm run test:party-capacity

      - name: Verify authored protagonist stat profiles
        run: npm run test:character-profiles

      - name: Verify JRPG stat/formula model
        run: npm run test:jrpg-stat-model

      - name: Verify production JRPG formula engine
        run: npm run test:jrpg-formula-engine

      - name: Verify Commons Ledger SSOT contract
        run: npm run test:commons-ledger

      - name: Verify Aether Seal design contract
        run: npm run test:aether-seal-contract

      - name: Verify dossier-bound character canon
        run: npm run test:character-canon

      - name: Verify runtime/documentation SSOT
        run: npm run test:runtime-ssot

      - name: Verify secondary-action state
        run: npm run test:secondary-action

      - name: Verify magic domain registry
        run: npm run test:magic-defs

      - name: Verify magic mastery evaluator
        run: npm run test:magic-mastery

      - name: Verify character magic profiles
        run: npm run test:character-magic-profile

      - name: Verify persistent party magic profiles
        run: npm run test:party-magic-profile

      - name: Verify magic field reactions
        run: npm run test:magic-field-reactions

      - name: Verify elemental spell trees
        run: npm run test:elemental-spell-trees

      - name: Verify non-elemental spell trees
        run: npm run test:non-elemental-spell-trees

      - name: Verify unified spell access
        run: npm run test:magic-spell-access

      - name: Verify explicit magic study transactions
        run: npm run test:magic-study

      - name: Verify air-navigation foundation
        run: npm run test:air-navigation

      - name: Verify input runtime contracts
        run: npm run test:input-runtime

      - name: Verify overlay and economy contracts
        run: npm run test:overlay-contract

      - name: Verify pixel world atmosphere
        run: npm run test:pixel-world-ambient

      - name: Verify shared pixel sprite authority
        run: npm run test:pixel-sprites

      - name: Verify shared pixel tile authority
        run: npm run test:pixel-tiles

      - name: Verify 16-bit world composition
        run: npm run test:16bit-world-art

      - name: Verify Dragonfly Dusk Dock benchmark
        run: npm run test:visual-benchmark

      - name: Verify representative dialogue visual gate
        run: npm run test:dialogue-visual

      - name: Verify representative combat visual gate
        run: npm run test:combat-visual

      - name: Verify aerial combat visual context
        run: npm run test:sky-combat-visual

      - name: Verify shared Dragonfly visual authority
        run: npm run test:dragonfly-visual

      - name: Verify Dragonfly flight visual gate
        run: npm run test:flight-visual

      - name: Verify visual evidence capture contract
        run: npm run test:visual-evidence-contract

      - name: Verify live open-sky runtime contract
        run: npm run test:open-sky-runtime

      - name: Verify First Wake opening runtime
        run: npm run test:first-wake-opening

      - name: Verify title visual stage
        run: npm run test:title-visual

      - name: Verify First Wake visual stage
        run: npm run test:first-wake-visual

      - name: Verify cinematic manifest contract
        run: npm run test:cinematics

      - name: Verify runtime cinematic player
        run: npm run test:cinematic-player

      - name: Verify direct title-theme contract
        run: npm run test:title-music

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: npm run test:smoke

  visual-evidence:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Verify capture contract
        run: npm run test:visual-evidence-contract

      - name: Capture exact PR-head visual evidence
        env:
          AETHERWAKE_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "$AETHERWAKE_SOURCE_SHA" = "$(git rev-parse HEAD)"
          npm run capture:visual-evidence

      - name: Upload visual evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: aetherwake-visual-evidence-${{ github.event.pull_request.head.sha }}
          path: visual-evidence/
          if-no-files-found: error
          retention-days: 14
