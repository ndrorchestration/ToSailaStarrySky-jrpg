name: Aetherwake smoke

on:
  push:
    branches:
      - main
      - dev/progression-build
  pull_request:

concurrency:
  group: aetherwake-smoke-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify effect vocabulary contract
        run: npm run test:effects

      - name: Verify ability/progression registries
        run: npm run test:registries

      - name: Verify effect resolver contract
        run: npm run test:resolver

      - name: Verify live resolver integration
        run: npm run test:resolver-integration

      - name: Verify enemy metadata propagation
        run: npm run test:enemy-metadata

      - name: Verify combat runtime bridge
        run: npm run test:combat-runtime

      - name: Verify combat input/log contract
        run: npm run test:combat-input

      - name: Verify resource/use eligibility
        run: npm run test:resource-eligibility

      - name: Verify progression reachability
        run: npm run test:progression-reachability

      - name: Verify long-form progression curve
        run: npm run test:longform-progression

      - name: Verify encounter scaling contract
        run: npm run test:encounter-scaling

      - name: Verify party capacity contract
        run: npm run test:party-capacity

      - name: Verify authored protagonist stat profiles
        run: npm run test:character-profiles

      - name: Verify JRPG stat/formula model
        run: npm run test:jrpg-stat-model

      - name: Verify production JRPG formula engine
        run: npm run test:jrpg-formula-engine

      - name: Verify Commons Ledger SSOT contract
        run: npm run test:commons-ledger

      - name: Verify Aether Seal design contract
        run: npm run test:aether-seal-contract

      - name: Verify dossier-bound character canon
        run: npm run test:character-canon

      - name: Verify runtime/documentation SSOT
        run: npm run test:runtime-ssot

      - name: Verify secondary-action state
        run: npm run test:secondary-action

      - name: Verify magic domain registry
        run: npm run test:magic-defs

      - name: Verify magic mastery evaluator
        run: npm run test:magic-mastery

      - name: Verify character magic profiles
        run: npm run test:character-magic-profile

      - name: Verify persistent party magic profiles
        run: npm run test:party-magic-profile

      - name: Verify magic field reactions
        run: npm run test:magic-field-reactions

      - name: Verify elemental spell trees
        run: npm run test:elemental-spell-trees

      - name: Verify non-elemental spell trees
        run: npm run test:non-elemental-spell-trees

      - name: Verify unified spell access
        run: npm run test:magic-spell-access

      - name: Verify explicit magic study transactions
        run: npm run test:magic-study

      - name: Verify air-navigation foundation
        run: npm run test:air-navigation

      - name: Verify semantic input action registry
        run: npm run test:input-actions

      - name: Verify deterministic focus manager
        run: npm run test:focus-manager

      - name: Verify standard gamepad semantic adapter
        run: npm run test:gamepad-input

      - name: Verify persistent input bindings
        run: npm run test:input-bindings

      - name: Verify input runtime contracts
        run: npm run test:input-runtime

      - name: Verify input/accessibility foundation contract
        run: npm run test:input-accessibility

      - name: Verify user settings persistence
        run: npm run test:user-settings

      - name: Verify Settings runtime integration
        run: npm run test:settings-runtime

      - name: Verify accessibility rendering policies
        run: npm run test:accessibility-rendering

      - name: Verify accessibility visual-review evidence contract
        run: npm run test:accessibility-visual-review

      - name: Verify governed audio asset authority
        run: npm run test:audio-assets

      - name: Verify title audio admission pipeline
        run: npm run test:title-audio-admission

      - name: Verify title audio handoff contract
        run: npm run test:title-audio-handoff

      - name: Verify title audio runtime registration
        run: npm run test:title-audio-runtime

      - name: Verify canonical music bus
        run: npm run test:music-bus

      - name: Verify audio settings mapping
        run: npm run test:audio-settings

      - name: Verify overlay and economy contracts
        run: npm run test:overlay-contract

      - name: Verify live open-sky runtime contract
        run: npm run test:open-sky-runtime

      - name: Verify First Wake opening runtime
        run: npm run test:first-wake-opening

      - name: Verify First Wake benchmark registry
        run: npm run test:first-wake-benchmark

      - name: Verify external playtest evidence contract
        run: npm run test:external-playtest-evidence

      - name: Verify external playtest packet contract
        run: npm run test:external-playtest-packet

      - name: Verify save storage contract
        run: npm run test:save-system

      - name: Verify save runtime integration
        run: npm run test:save-runtime

      - name: Verify semantic save payload validation
        run: npm run test:save-payload

      - name: Verify interrupted-write recovery
        run: npm run test:save-interrupted-write

      - name: Verify persistence coverage registry
        run: npm run test:persistence-coverage

      - name: Verify WORLD authority and four-hazard mirror
        run: npm run test:world-authority

      - name: Verify local M0 orchestration contract
        run: npm run test:m0-local-verification

      - name: Verify M0 operator lane contract
        run: npm run test:m0-operator-lane

      - name: Verify M0 manual acceptance dashboard contract
        run: npm run test:m0-manual-acceptance-dashboard

      - name: Verify final M0 acceptance contract
        run: npm run test:m0-acceptance-contract

      - name: Verify AI-assisted production contract
        run: npm run test:production-method

      - name: Verify release provenance evidence contract
        run: npm run test:release-evidence

      - name: Verify accessibility review packet contract
        run: npm run test:accessibility-review-packet

      - name: Verify cinematic manifest contract
        run: npm run test:cinematics

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke test
        run: npm run test:smoke

      - name: Run live First Wake benchmark
        run: npm run test:first-wake-benchmark-live

      - name: Run live controller parity smoke
        run: npm run test:controller-parity-live

      - name: Capture accessibility visual matrix
        run: npm run test:accessibility-visual-matrix

      - name: Prepare accessibility human-review packet
        if: always()
        run: npm run prepare:accessibility-review

      - name: Upload accessibility visual matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-visual-matrix
          path: artifacts/accessibility-visual-matrix
          if-no-files-found: warn
