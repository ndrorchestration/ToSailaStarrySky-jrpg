name: Godot mode-5 planetary material review
on:
  pull_request:
    paths:
      - 'godot/scripts/planetary/planetary_worldmap.gd'
      - 'godot/scripts/planetary/worldmap_cube_stream.gd'
      - 'godot/tests/worldmap_material_mode5_*.gd'
      - '.github/workflows/godot-mode5-material-review.yml'
  push:
    branches:
      - study/planetary-mode5-live-material-toggle-20261028

permissions:
  contents: read

jobs:
  mode5-native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2 Standard and software GL prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1 libgl1-mesa-dri
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Import complete real native planet project
        run: |
          timeout 90s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --editor --quit
      - name: Live mode-5 render, input, streaming and save contract
        run: |
          set -o pipefail
          timeout 120s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --headless --path godot --script res://tests/worldmap_material_mode5_test.gd \
            2>&1 | tee /tmp/mode5-contract.log
          grep -Eq 'GODOT_WORLDMAP_MATERIAL_MODE5_PASS checks=[0-9]+' /tmp/mode5-contract.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:|MODE5_FAIL' /tmp/mode5-contract.log
      - name: Exact real planetary flight-camera GL A/B evidence
        run: |
          set -o pipefail
          timeout 180s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/worldmap_material_mode5_capture.gd \
            2>&1 | tee /tmp/mode5-capture.log
          for biome in snow wet_ground; do
            grep -Eq "MODE5_NATIVE_MATERIAL_PAIR family=${biome} changed=[0-9]+ tile=" /tmp/mode5-capture.log
            grep -q "MODE5_NATIVE_MATERIAL_LOW family=${biome} pixels=0" /tmp/mode5-capture.log
            test -s "godot/evidence/mode5-material-review/${biome}-off.png"
            test -s "godot/evidence/mode5-material-review/${biome}-on.png"
          done
          grep -q 'GODOT_MODE5_MATERIAL_NATIVE_CAPTURE_PASS cases=2 real_scene=true mode5_camera=true' /tmp/mode5-capture.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:|MODE5_MATERIAL_' /tmp/mode5-capture.log
          sha256sum godot/evidence/mode5-material-review/*.png | tee /tmp/mode5-captures-sha256.txt
      - name: Preserve real native GL frames and logs on failure or success
        if: always()
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: mode5-material-evidence-${{ github.sha }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            godot/evidence/mode5-material-review/*.png
            /tmp/mode5-contract.log
            /tmp/mode5-capture.log
            /tmp/mode5-captures-sha256.txt
