name: Godot First Wake Creator Full-Body Source Study
on:
  pull_request:
    paths:
      - 'godot/scripts/pilot_actor.gd'
      - 'godot/scripts/first_wake_job_preview.gd'
      - 'godot/tests/first_wake_creator_standee_test.gd'
      - 'godot/tests/capture_first_wake_creator_field_reference.gd'
      - '.github/workflows/godot-first-wake-creator-field-standee.yml'
permissions:
  contents: read
jobs:
  static-source-field-preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Download checksum-pinned official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot-editor.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-editor.zip" | sha256sum -c -
          mkdir -p godot-editor
          unzip -q godot-editor.zip -d godot-editor
          chmod +x godot-editor/Godot_v4.7.2-stable_linux.x86_64
      - name: Native script and source-optional asset import
        shell: bash
        run: |
          set -euo pipefail
          godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit 2>&1 | tee /tmp/field-source-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' /tmp/field-source-import.log
      - name: Assert source-only actor toggle, missing-art fallback and original physics
        shell: bash
        run: |
          set -euo pipefail
          timeout 70s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path godot --script res://tests/first_wake_creator_standee_test.gd 2>&1 | tee /tmp/field-source-native-test.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|TSTSS_CREATOR_STANDEE_FAIL:' /tmp/field-source-native-test.log
          grep -Fq 'TSTSS_CREATOR_STANDEE_PASS' /tmp/field-source-native-test.log
      - name: Regress true First Wake story and physical water landing
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path godot --script res://tests/first_wake_game_entry_test.gd 2>&1 | tee /tmp/field-source-first-wake.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|TSTSS_FIRST_WAKE_GAME_ENTRY_FAIL:' /tmp/field-source-first-wake.log
          grep -Fq 'TSTSS_FIRST_WAKE_GAME_ENTRY_PASS' /tmp/field-source-first-wake.log
