name: Godot directional weapon cinematic candidate review
on:
  push:
    branches: [feat/godot-weapon-directional-cinematic-review-20261027]
    paths:
      - 'godot/scripts/weapon_*.gd'
      - 'godot/scenes/weapon_directional_cinematic_review.tscn'
      - 'godot/tests/weapon_directional_cinematic_review_test.gd'
      - 'godot/tests/capture_weapon_directional_cinematic_review.gd'
      - '.github/workflows/godot-weapon-directional-cinematic-review.yml'
  pull_request:
    paths:
      - 'godot/scripts/weapon_*.gd'
      - 'godot/scenes/weapon_directional_cinematic_review.tscn'
      - 'godot/tests/weapon_directional_cinematic_review_test.gd'
      - 'godot/tests/capture_weapon_directional_cinematic_review.gd'
      - '.github/workflows/godot-weapon-directional-cinematic-review.yml'
permissions:
  contents: read
jobs:
  native-candidate-cinematic:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Obtain digest-verified official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o editor.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  editor.zip' | sha256sum -c -
          unzip -q editor.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import and parse exact-head Godot project
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Preserve existing tree and animation regressions
        shell: bash
        run: |
          set -euo pipefail
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/weapon_skill_tree_review_test.gd
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/weapon_choreography_review_test.gd
          ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/weapon_battle_visual_adapter_test.gd
      - name: Run four-way Ender visual provenance and nonexecution tests
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/weapon_directional_cinematic_review_test.gd
      - name: Capture six actual 960x640 Godot directional and motion comparison frames
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          mkdir -p godot/review-evidence
          xvfb-run -a -s "-screen 0 960x640x24" ./Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_weapon_directional_cinematic_review.gd
          for shot in ender-east-impact ender-west-impact ender-south-impact ender-north-impact ender-east-reduced geometric-mannequin; do
            test -s "godot/review-evidence/${shot}-native-960x640.png"
          done
          sha256sum godot/review-evidence/*-native-960x640.png
          echo "PROTAGONIST_ART_ACCEPTANCE=NOT_ESTABLISHED"
          echo "AUTHORING_NEW_COMBAT_ANIMATIONS=NOT_ESTABLISHED"
          echo "COMBAT_EXECUTION=FALSE"
          echo "NATIVE_RENDER_FRAMES=RUNNER_ONLY"
