# Temporary, branch-scoped one-shot importer; removed from the final review diff.
name: Native Godot screenshot gallery import
on:
  push:
    branches:
      - docs/native-godot-screenshot-gallery-20261027
    paths:
      - .github/workflows/native-gallery-import-temporary.yml
permissions:
  contents: write
  actions: read
jobs:
  import-captures:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out documentation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install image conversion dependency
        run: python3 -m pip install --disable-pip-version-check "Pillow==11.3.0"
      - name: Download exact prior Godot native capture artifact
        uses: actions/download-artifact@v4
        with:
          name: godot-flight-slice-software-captures
          path: /tmp/starry-native-captures
          repository: ndrorchestration/ToSailtheStarrySky-jrpg
          run-id: 40578319950
          github-token: ${{ github.token }}
      - name: Download exact native character lineup review log
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/ndrorchestration/ToSailtheStarrySky-jrpg/actions/jobs/122447121463/logs" \
            --output /tmp/starry-lineup-native.log
      - name: Preserve source PNGs and author optimized JPGs with SHA-256 manifest
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          from io import BytesIO
          from hashlib import sha256
          import base64, json, re
          root = Path('/tmp/starry-native-captures')
          output = Path('docs/screenshots/native-2026-10-27')
          (output / 'original').mkdir(parents=True, exist_ok=True)
          selections = {
              'aureate-wake-bow': 'evidence/ship-hero/bow-quarter.png',
              'aureate-wake-stern': 'evidence/ship-hero/stern-quarter.png',
              'aureate-wake-wings': 'evidence/ship-hero/wing-planform.png',
              'aureate-wake-rain': 'evidence/ship-hero/bow-bluehour-rain.png',
              'aureate-wake-storm': 'evidence/ship-hero/bow-storm-magic.png',
              'coast-dusk': 'evidence/cinematic-review/coast-dusk.png',
              'forest-golden': 'evidence/cinematic-review/forest-gold.png',
              'highland-horizon': 'evidence/cinematic-review/highland-horizon.png',
              'storm-sky': 'evidence/environment-mood/storm-night-magic.png',
          }
          manifest = {
              'status':'native Godot rendered captures; experimental, not artist-approved',
              'engine':'Godot 4.7.2',
              'capture_source':'ndrorchestration/ToSailtheStarrySky-jrpg',
              'ship_terrain_source_pr':422,
              'ship_terrain_source_commit':'0ba35e6bd4e6acd4c5b7e880be1758d17feebab6',
              'ship_terrain_workflow_run':40578319950,
              'ship_terrain_artifact_id':12768611791,
              'character_source_pr':421,
              'character_source_commit':'3ddd36b2c3b46ae7546da60e732905e665773fd9',
              'character_workflow_run':40577322365,
              'character_job_log':122447121463,
              'cross_branch_montage':True,
              'files':{}
          }
          for dest, source in selections.items():
              matches = [p for p in root.rglob(source.rsplit('/',1)[-1]) if p.as_posix().endswith(source)]
              if len(matches) != 1:
                  raise SystemExit(f'Exact source missing or ambiguous: {source} ({len(matches)})')
              raw = matches[0].read_bytes()
              assert raw.startswith(b'\x89PNG\r\n\x1a\n')
              im = Image.open(BytesIO(raw)).convert('RGB')
              if im.size != (960,640): raise SystemExit(f'Invalid capture dimensions for {dest}: {im.size}')
              original = output / 'original' / (dest+'.png')
              original.write_bytes(raw)
              optimized = output / (dest+'.jpg')
              im.save(optimized,format='JPEG',quality=82,optimize=True,progressive=True)
              manifest['files'][dest] = {
                  'origin':source,
                  'original_png':'original/'+dest+'.png',
                  'original_sha256':sha256(raw).hexdigest(),
                  'optimized_jpg':dest+'.jpg',
                  'optimized_sha256':sha256(optimized.read_bytes()).hexdigest(),
                  'dimensions':[960,640],
                  'source_type':'native frame; optimization changes encoding only'
              }
          logs = Path('/tmp/starry-lineup-native.log').read_text(encoding='utf-8',errors='replace')
          match = re.search(r'CHARACTER_LINEUP_PREVIEW_480x320_JPEG_BASE64:([A-Za-z0-9+/=]+)', logs)
          if match is None: raise SystemExit('No authentic native character preview found in source job log')
          chars = base64.b64decode(match.group(1),validate=True)
          with Image.open(BytesIO(chars)) as preview:
              if preview.size != (480,320): raise SystemExit(f'Unexpected character preview size {preview.size}')
              if preview.format != 'JPEG': raise SystemExit('Character preview is not JPEG')
          (output / 'five-lights-lineup.jpg').write_bytes(chars)
          manifest['files']['five-lights-lineup']={
              'origin':'job 122447121463: CHARACTER_LINEUP_PREVIEW_480x320_JPEG_BASE64',
              'optimized_jpg':'five-lights-lineup.jpg',
              'optimized_sha256':sha256(chars).hexdigest(),
              'dimensions':[480,320],
              'source_type':'native frame derived review thumbnail; 960x640 source not published here'
          }
          (output / 'provenance.json').write_text(json.dumps(manifest,sort_keys=True,indent=2)+'\n')
          for name,item in manifest['files'].items():
              print(f'CAPTURE_ADMITTED {name} {item["optimized_sha256"]}')
          PY
      - name: Commit screenshot assets on this review branch only
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "docs/native-godot-screenshot-gallery-20261027"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/native-2026-10-27/
          if git diff --cached --quiet; then echo 'Gallery images already identical'; exit 0; fi
          git commit -m "docs(visual): add native screenshot PNG originals and optimized README JPEGs"
          git push origin HEAD:refs/heads/docs/native-godot-screenshot-gallery-20261027
