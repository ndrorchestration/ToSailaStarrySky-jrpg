# SECURITY HOLD — 2026-10-26
# The original NW.js + NSIS Aetherwake desktop release workflow is RETIRED.
# It is preserved in immutable Git history at blob
# 0a5479ff5ed551d205444e4b90fc1cc754f8c032.
# Do not execute, distribute, whitelist or restore the historical flagged
# installer/uninstaller. See issue #293. The current development target is
# Godot 4.7.2 + GDScript per AGENTS.md; Chapter I has a separate Windows QA
# gate whose Defender-real-time preflight must remain fail-closed.
#
# This workflow can be manually invoked ONLY to get an explicit blocking error.
# No push/tag trigger, no installer/package build and no release write permission.
name: Legacy NW.js Windows release — BLOCKED

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/desktop-package.yml'

permissions:
  contents: read

jobs:
  retired-release:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Verify security hold when reviewing this file
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          echo "::notice title=Legacy desktop release blocked::NW.js/NSIS publication remains disabled pending explicit source, Defender, rights and creator review."
          echo "LEGACY_NWJS_RELEASE_STATUS=DISABLED"
      - name: Refuse manual execution
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          echo "::error title=Legacy release security hold::This historical NW.js/NSIS workflow is disabled. Do not attempt to execute its old installer or publish a release. See security issue #293 and the native Godot Chapter I Windows QA gate."
          exit 1
