name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run contract tests
        run: npm run test:desktop-package

      - name: Build Windows package
        run: npm run package:windows

      - name: Create distributable ZIP
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ..\\aetherwake-dist -Directory | Select-Object -First 1
          if (-not $package) { throw "NW.js did not produce a package directory" }
          Compress-Archive -Path "$($package.FullName)\\*" -DestinationPath "Aetherwake-Windows.zip"

      - name: Publish Windows package release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aetherwake-desktop-${{ github.sha }}
          name: Aetherwake Windows Desktop ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: Aetherwake-Windows.zip
