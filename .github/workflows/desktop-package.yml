name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run desktop packaging contract
        run: npm run test:desktop-package

      - name: Build Windows NW.js package
        run: npm run package:windows

      - name: Locate package directory
        id: package
        shell: bash
        run: |
          package="$(find ../aetherwake-dist -mindepth 1 -maxdepth 1 -type d | head -n 1)"
          if [ -z "$package" ]; then
            echo "NW.js did not produce a package directory" >&2
            exit 1
          fi
          test -f "$package/Aetherwake.exe"
          echo "dir=$package" >> "$GITHUB_OUTPUT"

      - name: Build portable ZIP
        shell: bash
        run: |
          cd "${{ steps.package.outputs.dir }}"
          zip -r "$GITHUB_WORKSPACE/Aetherwake-Windows.zip" .

      - name: Install NSIS
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build no-admin Windows installer
        shell: bash
        env:
          PACKAGE_DIR: ${{ steps.package.outputs.dir }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          source = Path(os.environ["PACKAGE_DIR"]).resolve()
          script = f'''Unicode true
          Name "Aetherwake"
          OutFile "Aetherwake-Setup.exe"
          InstallDir "$LOCALAPPDATA\\Programs\\Aetherwake"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma

          Page directory
          Page instfiles

          Section "Aetherwake" SEC_MAIN
            SetOutPath "$INSTDIR"
            File /r "{source.as_posix()}/*"
            CreateShortCut "$DESKTOP\\Aetherwake.lnk" "$INSTDIR\\Aetherwake.exe"
            CreateDirectory "$SMPROGRAMS\\Aetherwake"
            CreateShortCut "$SMPROGRAMS\\Aetherwake\\Aetherwake.lnk" "$INSTDIR\\Aetherwake.exe"
            WriteUninstaller "$INSTDIR\\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\\Aetherwake.lnk"
            Delete "$SMPROGRAMS\\Aetherwake\\Aetherwake.lnk"
            RMDir "$SMPROGRAMS\\Aetherwake"
            RMDir /r "$INSTDIR"
          SectionEnd
          '''
          Path("Aetherwake-Setup.nsi").write_text(script, encoding="utf-8")
          PY
          makensis Aetherwake-Setup.nsi
          test -f Aetherwake-Setup.exe

      - name: Write SHA-256 manifest
        run: sha256sum Aetherwake-Setup.exe Aetherwake-Windows.zip > SHA256SUMS.txt

      - name: Upload Windows candidate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aetherwake-windows-candidate
          path: |
            Aetherwake-Setup.exe
            Aetherwake-Windows.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  verify-windows:
    needs: build-windows
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - name: Download Windows candidate
        uses: actions/download-artifact@v4
        with:
          name: aetherwake-windows-candidate

      - name: Install and launch packaged app
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "AetherwakeInstall"
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }
          $installer = Start-Process -FilePath (Join-Path $PWD "Aetherwake-Setup.exe") -ArgumentList @(
            "/S",
            "/D=$installDir"
          ) -Wait -PassThru
          if ($installer.ExitCode -ne 0) { throw "Installer exited with code $($installer.ExitCode)" }
          $exe = Join-Path $installDir "Aetherwake.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Installed Aetherwake.exe was not found" }
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) { throw "Installed Aetherwake.exe exited during launch smoke with code $($process.ExitCode)" }
          Stop-Process -Id $process.Id -Force

      - name: Verify portable package layout
        shell: pwsh
        run: |
          Expand-Archive -LiteralPath Aetherwake-Windows.zip -DestinationPath portable
          if (-not (Test-Path -LiteralPath portable\Aetherwake.exe)) {
            throw "Portable Aetherwake.exe was not found"
          }

  publish-windows:
    needs: verify-windows
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Download verified Windows artifacts
        uses: actions/download-artifact@v4
        with:
          name: aetherwake-windows-candidate

      - name: Publish verified Windows release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aetherwake-desktop-${{ github.sha }}
          name: Aetherwake Windows Desktop ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: |
            Aetherwake-Setup.exe
            Aetherwake-Windows.zip
            SHA256SUMS.txt
