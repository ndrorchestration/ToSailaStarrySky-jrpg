name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev/progression-build
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run desktop packaging contract
        run: npm run test:desktop-package

      - name: Build Windows package
        run: npm run package:windows

      - name: Verify packaged application
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path ..\aetherwake-dist -ErrorAction Stop
          Write-Host "NW.js output root: $packageRoot"
          Get-ChildItem -Path $packageRoot | Select-Object Name, Length, Mode | Format-Table -AutoSize

          $exe = Join-Path $packageRoot "Aetherwake.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            $executables = Get-ChildItem -Path $packageRoot -Filter "*.exe" -File -Recurse |
              Select-Object -ExpandProperty FullName
            throw "Packaged Aetherwake.exe was not found. Executables present: $($executables -join ', ')"
          }

          $packageNw = Join-Path $packageRoot "package.nw"
          if (-not (Test-Path -LiteralPath $packageNw -PathType Container)) {
            throw "Packaged package.nw application directory was not found"
          }

          $manifest = Join-Path $packageNw "package.json"
          $entrypoint = Join-Path $packageNw "index-embedded.html"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "Packaged package.json was not found inside package.nw"
          }
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) {
            throw "Packaged index-embedded.html was not found inside package.nw"
          }

          if ((Get-Item $exe).Length -le 0 -or (Get-Item $manifest).Length -le 0 -or
              (Get-Item $entrypoint).Length -le 0) {
            throw "Packaged executable, manifest, or entry point is empty"
          }

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "artifact\Aetherwake-Windows"
          if (Test-Path "artifact") { Remove-Item "artifact" -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "..\aetherwake-dist\*" -Destination $stage -Recurse -Force

          if (-not (Test-Path (Join-Path $stage "Aetherwake.exe") -PathType Leaf)) {
            throw "Staged artifact is missing Aetherwake.exe"
          }
          if (-not (Test-Path (Join-Path $stage "package.nw\index-embedded.html") -PathType Leaf)) {
            throw "Staged artifact is missing package.nw/index-embedded.html"
          }

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Aetherwake-Windows
          path: artifact/Aetherwake-Windows/**
          if-no-files-found: error
          compression-level: 6
