name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run contract tests
        run: npm run test:desktop-package

      - name: Build Windows package
        run: npm run package:windows

      - name: Build standard Windows installer with Inno Setup
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ..\\aetherwake-dist -Directory | Select-Object -First 1
          if (-not $package) { throw "NW.js did not produce a package directory" }
          $iscc = @(
            "C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe",
            "C:\\Program Files\\Inno Setup 6\\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "Inno Setup compiler not found" }
          $source = $package.FullName.Replace('\', '\\')
          $script = @"
          [Setup]
          AppName=Aetherwake
          AppVersion=0.2.0
          DefaultDirName={autopf}\\Aetherwake
          DisableProgramGroupPage=yes
          Uninstallable=no
          ArchitecturesInstallIn64BitMode=x64
          OutputDir=.
          OutputBaseFilename=Aetherwake-Setup
          Compression=lzma2
          SolidCompression=yes

          [Files]
          Source: "$source\\*"; DestDir: "{app}"; Flags: recursesubdirs createallsubdirs ignoreversion

          [Icons]
          Name: "{autodesktop}\\Aetherwake"; Filename: "{app}\\Aetherwake.exe"
          Name: "{autoprograms}\\Aetherwake"; Filename: "{app}\\Aetherwake.exe"

          [Run]
          Filename: "{app}\\Aetherwake.exe"; Description: "Launch Aetherwake"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path Aetherwake-Setup.iss -Value $script -Encoding utf8
          & $iscc Aetherwake-Setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup compilation failed" }
          if (-not (Test-Path Aetherwake-Setup.exe)) { throw "Installer was not created" }

      - name: Create distributable ZIP fallback
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ..\\aetherwake-dist -Directory | Select-Object -First 1
          Compress-Archive -Path "$($package.FullName)\\*" -DestinationPath "Aetherwake-Windows.zip"

      - name: Publish Windows package release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aetherwake-desktop-\${{ github.sha }}
          name: Aetherwake Windows Desktop \${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: |
            Aetherwake-Setup.exe
            Aetherwake-Windows.zip
