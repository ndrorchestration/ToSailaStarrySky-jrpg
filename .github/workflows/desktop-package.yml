name: Windows desktop package

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev/progression-build
    paths:
      - ".github/workflows/desktop-package.yml"
      - "aetherwake.js"
      - "index.html"
      - "index-embedded.html"
      - "package.json"
      - "icon.svg"
      - "modules/**"
      - "packaging/**"
      - "scripts/stage-desktop-runtime.js"
      - "scripts/generate-windows-icon.ps1"
      - "tests/desktop-package-contract.test.js"
      - "tests/one-file-launcher-contract.test.js"
      - "scripts/verify-windows-packaged-render.ps1"
  push:
    branches:
      - main
      - dev/progression-build
    tags:
      - "v*"
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run desktop packaging contracts
        run: |
          npm run test:desktop-package
          npm run test:one-file-launcher

      - name: Build Windows package
        run: npm run package:windows

      - name: Verify packaged application
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path ..\aetherwake-dist -ErrorAction Stop
          Write-Host "NW.js output root: $packageRoot"
          Get-ChildItem -Path $packageRoot | Select-Object Name, Length, Mode | Format-Table -AutoSize

          $exe = Join-Path $packageRoot "Aetherwake.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            $executables = Get-ChildItem -Path $packageRoot -Filter "*.exe" -File -Recurse |
              Select-Object -ExpandProperty FullName
            throw "Packaged Aetherwake.exe was not found. Executables present: $($executables -join ', ')"
          }

          $packageNw = Join-Path $packageRoot "package.nw"
          if (-not (Test-Path -LiteralPath $packageNw -PathType Container)) {
            throw "Packaged package.nw application directory was not found"
          }

          $manifest = Join-Path $packageNw "package.json"
          $entrypoint = Join-Path $packageNw "index-embedded.html"
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "Packaged package.json was not found inside package.nw"
          }
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) {
            throw "Packaged index-embedded.html was not found inside package.nw"
          }

          if ((Get-Item $exe).Length -le 0 -or (Get-Item $manifest).Length -le 0 -or
              (Get-Item $entrypoint).Length -le 0) {
            throw "Packaged executable, manifest, or entry point is empty"
          }

          $forbiddenRuntimeEntries = @("node_modules", "tests", "docs", ".github", "scripts", "build")
          foreach ($entry in $forbiddenRuntimeEntries) {
            $candidate = Join-Path $packageNw $entry
            if (Test-Path -LiteralPath $candidate) {
              throw "Development-only content leaked into package.nw: $entry"
            }
          }

          $packageNwBytes = (
            Get-ChildItem -LiteralPath $packageNw -File -Recurse |
            Measure-Object -Property Length -Sum
          ).Sum
          Write-Host "package.nw application payload bytes: $packageNwBytes"
          if ($packageNwBytes -le 0 -or $packageNwBytes -gt 20MB) {
            throw "package.nw runtime payload outside expected 0-20 MiB bound: $packageNwBytes"
          }

      - name: Stage Windows artifact
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "artifact\Aetherwake-Windows"
          if (Test-Path -LiteralPath $stage) { Remove-Item $stage -Recurse -Force }
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item -Path "..\aetherwake-dist\*" -Destination $stage -Recurse -Force

          if (-not (Test-Path (Join-Path $stage "Aetherwake.exe") -PathType Leaf)) {
            throw "Staged artifact is missing Aetherwake.exe"
          }
          if (-not (Test-Path (Join-Path $stage "package.nw\index-embedded.html") -PathType Leaf)) {
            throw "Staged artifact is missing package.nw/index-embedded.html"
          }


      - name: Generate one-file launcher icon
        shell: pwsh
        run: ./scripts/generate-windows-icon.ps1

      - name: Build one-file Aetherwake launcher
        shell: pwsh
        run: |
          $launcherDir = Join-Path $PWD "packaging\one-file-launcher"
          $payload = Join-Path $launcherDir "Payload.zip"
          if (Test-Path -LiteralPath $payload) { Remove-Item $payload -Force }
          Compress-Archive -Path "..\aetherwake-dist\*" -DestinationPath $payload -CompressionLevel Optimal

          $publish = Join-Path $PWD "launcher-publish"
          if (Test-Path -LiteralPath $publish) { Remove-Item $publish -Recurse -Force }
          dotnet publish "$launcherDir\AetherwakeLauncher.csproj" -c Release -r win-x64 --self-contained true -o $publish

          $built = Join-Path $publish "AetherwakeOneFile.exe"
          if (-not (Test-Path -LiteralPath $built -PathType Leaf)) {
            throw "One-file launcher was not produced: $built"
          }

          $oneFileStage = Join-Path $PWD "artifact\Aetherwake-One-File"
          if (Test-Path -LiteralPath $oneFileStage) { Remove-Item $oneFileStage -Recurse -Force }
          New-Item -ItemType Directory -Path $oneFileStage -Force | Out-Null
          $playerFile = Join-Path $oneFileStage "Aetherwake - The Last Solarpunk Airship.exe"
          Copy-Item -LiteralPath $built -Destination $playerFile -Force

          $files = @(Get-ChildItem -LiteralPath $oneFileStage -File)
          if ($files.Count -ne 1 -or $files[0].Name -ne "Aetherwake - The Last Solarpunk Airship.exe") {
            throw "One-file artifact must contain exactly the recognizable Aetherwake executable"
          }
          if ($files[0].Length -le 0) { throw "One-file Aetherwake executable is empty" }
          $header = [System.IO.File]::ReadAllBytes($playerFile)[0..1]
          if ($header[0] -ne 0x4D -or $header[1] -ne 0x5A) {
            throw "One-file Aetherwake executable is not a valid Windows PE file"
          }
          Write-Host "One-file Aetherwake executable bytes: $($files[0].Length)"

      - name: Launch one-file executable end to end
        shell: pwsh
        run: |
          $playerFile = Join-Path $PWD "artifact\Aetherwake-One-File\Aetherwake - The Last Solarpunk Airship.exe"
          if (-not (Test-Path -LiteralPath $playerFile -PathType Leaf)) {
            throw "One-file player executable is missing before launch test"
          }

          $runtimeRoot = Join-Path $env:LOCALAPPDATA "Aetherwake\runtime"
          if (Test-Path -LiteralPath $runtimeRoot) {
            Remove-Item $runtimeRoot -Recurse -Force
          }

          $launcher = Start-Process -FilePath $playerFile -PassThru
          if (-not $launcher.WaitForExit(180000)) {
            try { $launcher.Kill() } catch {}
            throw "One-file launcher process did not exit within 180 seconds"
          }
          if ($launcher.ExitCode -ne 0) {
            throw "One-file launcher exited with code $($launcher.ExitCode)"
          }

          $deadline = (Get-Date).AddSeconds(45)
          $inner = $null
          while ((Get-Date) -lt $deadline -and -not $inner) {
            Start-Sleep -Milliseconds 500
            if (Test-Path -LiteralPath $runtimeRoot) {
              $inner = Get-ChildItem -LiteralPath $runtimeRoot -Filter "Aetherwake.exe" -File -Recurse -ErrorAction SilentlyContinue |
                Select-Object -First 1
            }
          }

          if (-not $inner) {
            throw "One-file launcher did not materialize its private Aetherwake.exe runtime"
          }

          $packageNw = Join-Path $inner.Directory.FullName "package.nw"
          $entrypoint = Join-Path $packageNw "index-embedded.html"
          if (-not (Test-Path -LiteralPath $entrypoint -PathType Leaf)) {
            throw "One-file launcher runtime is missing package.nw/index-embedded.html"
          }

          $running = $null
          $deadline = (Get-Date).AddSeconds(30)
          while ((Get-Date) -lt $deadline -and -not $running) {
            Start-Sleep -Milliseconds 500
            $running = Get-CimInstance Win32_Process -Filter "Name = 'Aetherwake.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.ExecutablePath -eq $inner.FullName } |
              Select-Object -First 1
          }

          if (-not $running) {
            throw "One-file launcher extracted the runtime but did not start Aetherwake.exe"
          }

          Write-Host "One-file launch PASS: $($inner.FullName)"
          Write-Host "Runtime entry point PASS: $entrypoint"

          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ExecutablePath -and
              $_.ExecutablePath.StartsWith($inner.Directory.FullName, [System.StringComparison]::OrdinalIgnoreCase)
            } |
            ForEach-Object {
              Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
            }

      - name: Verify one-file packaged window renders
        shell: pwsh
        run: |
          $playerFile = Join-Path $PWD "artifact\Aetherwake-One-File\Aetherwake - The Last Solarpunk Airship.exe"
          $runtimeRoot = Join-Path $env:LOCALAPPDATA "Aetherwake\runtime"

          Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
            Where-Object {
              $_.ExecutablePath -and
              $_.ExecutablePath.StartsWith($runtimeRoot, [System.StringComparison]::OrdinalIgnoreCase)
            } |
            ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }

          $env:AETHERWAKE_DIAGNOSTICS = "1"
          $launcher = Start-Process -FilePath $playerFile -PassThru
          if (-not $launcher.WaitForExit(180000)) {
            try { $launcher.Kill() } catch {}
            throw "One-file launcher process did not exit within 180 seconds during window-render probe"
          }
          if ($launcher.ExitCode -ne 0) {
            throw "One-file launcher exited with code $($launcher.ExitCode) during window-render probe"
          }

          try {
            ./scripts/verify-windows-packaged-render.ps1
          }
          finally {
            Get-CimInstance Win32_Process -ErrorAction SilentlyContinue |
              Where-Object {
                $_.ExecutablePath -and
                $_.ExecutablePath.StartsWith($runtimeRoot, [System.StringComparison]::OrdinalIgnoreCase)
              } |
              ForEach-Object { Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue }
          }

      - name: Upload packaged-window diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Aetherwake-Packaged-Window-Diagnostic
          path: artifact/aetherwake-packaged-window.png
          if-no-files-found: warn
          compression-level: 0

      - name: Upload one-file Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: Aetherwake-One-File
          path: artifact/Aetherwake-One-File/Aetherwake - The Last Solarpunk Airship.exe
          if-no-files-found: error
          compression-level: 0
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Aetherwake-Windows
          path: artifact/Aetherwake-Windows/**
          if-no-files-found: error
          compression-level: 6
