name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev/progression-build
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26.7.0

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run desktop packaging contract
        run: npm run test:desktop-package

      - name: Build Windows package
        run: npm run package:windows

      - name: Verify packaged application
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path ..\aetherwake-dist -ErrorAction Stop
          Write-Host "NW.js output root: $packageRoot"
          Get-ChildItem -Path $packageRoot | Select-Object Name, Length, Mode | Format-Table -AutoSize

          $exe = Join-Path $packageRoot "Aetherwake.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            $executables = Get-ChildItem -Path $packageRoot -Filter "*.exe" -File -Recurse |
              Select-Object -ExpandProperty FullName
            throw "Packaged Aetherwake.exe was not found. Executables present: $($executables -join ', ')"
          }

          $packageNw = Join-Path $packageRoot "package.nw"
          if (-not (Test-Path -LiteralPath $packageNw -PathType Leaf)) {
            throw "Packaged package.nw was not found"
          }

          if ((Get-Item $exe).Length -le 0 -or (Get-Item $packageNw).Length -le 0) {
            throw "Packaged executable or package.nw is empty"
          }

      - name: Create distributable ZIP
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path ..\aetherwake-dist -ErrorAction Stop
          Compress-Archive -Path "$packageRoot\*" -DestinationPath "Aetherwake-Windows.zip"

      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Aetherwake-Windows
          path: Aetherwake-Windows.zip
          if-no-files-found: error
