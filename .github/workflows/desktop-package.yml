name: Windows desktop package

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run contract tests
        run: npm run test:desktop-package

      - name: Build Windows package
        run: npm run package:windows

      - name: Create one-click Windows launcher
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ..\\aetherwake-dist -Directory | Select-Object -First 1
          if (-not $package) { throw "NW.js did not produce a package directory" }
          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\\7z.exe"
          $sfx = Join-Path $env:ProgramFiles "7-Zip\\7z.sfx"
          if (-not (Test-Path $sevenZip)) { throw "7-Zip executable not found" }
          if (-not (Test-Path $sfx)) { throw "7-Zip SFX module not found" }
          $config = @"
          ;!@Install@!UTF-8!
          RunProgram="Aetherwake.exe"
          InstallPath="%TEMP%\\Aetherwake-OneClick"
          Title="Aetherwake"
          ;!@InstallEnd@!
          "@
          Set-Content -Path Aetherwake-OneClick-config.txt -Value $config -Encoding utf8
          & $sevenZip a -t7z Aetherwake-OneClick.7z "$($package.FullName)\\*" -mx=9
          if ($LASTEXITCODE -ne 0) { throw "7-Zip archive creation failed" }
          cmd /c copy /b "$sfx+Aetherwake-OneClick-config.txt+Aetherwake-OneClick.7z" Aetherwake-OneClick.exe
          if (-not (Test-Path Aetherwake-OneClick.exe)) { throw "One-click launcher was not created" }

      - name: Create distributable ZIP fallback
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path ..\\aetherwake-dist -Directory | Select-Object -First 1
          Compress-Archive -Path "$($package.FullName)\\*" -DestinationPath "Aetherwake-Windows.zip"

      - name: Publish Windows package release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aetherwake-desktop-${{ github.sha }}
          name: Aetherwake Windows Desktop ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: |
            Aetherwake-OneClick.exe
            Aetherwake-Windows.zip
