name: Windows desktop package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-package-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run desktop packaging contract
        run: npm run test:desktop-package

  verify-windows:
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify clean source checkout
        shell: pwsh
        run: |
          $status = (git status --porcelain=v1) -join "
"
          if (-not [string]::IsNullOrWhiteSpace([string]$status)) { throw "Release source checkout is not clean" }
          Write-Host "SOURCE_COMMIT=$(git rev-parse HEAD)"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run desktop packaging contract
        run: npm run test:desktop-package

      - name: Require admitted title audio for release candidate
        run: npm run test:m0-title-audio-ready

      - name: Build Windows NW.js package
        run: npm run package:windows

      - name: Locate package directory
        id: package
        shell: pwsh
        run: |
          $package = Get-ChildItem -Path (Join-Path $PWD "..\aetherwake-dist") -Directory | Select-Object -First 1
          if (-not $package) { throw "NW.js did not produce a package directory" }
          $exe = Join-Path $package.FullName "Aetherwake.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "NW.js package is missing Aetherwake.exe" }
          "dir=$($package.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Verify packaged title audio
        shell: pwsh
        run: |
          npm run verify:packaged-title-audio -- "${{ steps.package.outputs.dir }}"
          if ($LASTEXITCODE -ne 0) { throw "Packaged title-audio verification failed" }
          Write-Host "PACKAGED_TITLE_AUDIO=PASS"

      - name: Build portable ZIP
        shell: pwsh
        run: |
          $package = "${{ steps.package.outputs.dir }}"
          Compress-Archive -Path (Join-Path $package "*") -DestinationPath (Join-Path $PWD "Aetherwake-Windows.zip") -Force

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          $makensis = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          ) | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
          if (-not $makensis) { throw "NSIS makensis.exe not found after installation" }
          "MAKENSIS=$makensis" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build no-admin Windows installer
        shell: pwsh
        run: |
          $source = "${{ steps.package.outputs.dir }}"
          $outFile = Join-Path $PWD "Aetherwake-Setup.exe"
          $scriptPath = Join-Path $PWD "Aetherwake-Setup.nsi"
          $template = @'
          Unicode true
          Name "Aetherwake"
          OutFile "__OUTPUT__"
          InstallDir "$LOCALAPPDATA\Programs\Aetherwake"
          RequestExecutionLevel user
          SetCompressor /SOLID lzma

          Page directory
          Page instfiles

          Section "Aetherwake" SEC_MAIN
            SetOutPath "$INSTDIR"
            File /r "__SOURCE__\*"
            CreateShortCut "$DESKTOP\Aetherwake.lnk" "$INSTDIR\Aetherwake.exe"
            CreateDirectory "$SMPROGRAMS\Aetherwake"
            CreateShortCut "$SMPROGRAMS\Aetherwake\Aetherwake.lnk" "$INSTDIR\Aetherwake.exe"
            WriteUninstaller "$INSTDIR\Uninstall.exe"
          SectionEnd

          Section "Uninstall"
            Delete "$DESKTOP\Aetherwake.lnk"
            Delete "$SMPROGRAMS\Aetherwake\Aetherwake.lnk"
            RMDir "$SMPROGRAMS\Aetherwake"
            RMDir /r "$INSTDIR"
          SectionEnd
          '@
          $template.Replace('__OUTPUT__', $outFile).Replace('__SOURCE__', $source) |
            Set-Content -LiteralPath $scriptPath -Encoding UTF8
          & $env:MAKENSIS $scriptPath
          if ($LASTEXITCODE -ne 0) { throw "NSIS compilation failed with code $LASTEXITCODE" }
          if (-not (Test-Path -LiteralPath $outFile)) { throw "Aetherwake-Setup.exe was not created" }

      - name: Install and launch exact candidate
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "AetherwakeInstall"
          $marker = Join-Path $env:RUNNER_TEMP "aetherwake-desktop-ready.json"
          if (Test-Path -LiteralPath $marker) {
            Remove-Item -LiteralPath $marker -Force
          }
          if (Test-Path -LiteralPath $installDir) {
            Remove-Item -LiteralPath $installDir -Recurse -Force
          }
          $installer = Join-Path $PWD "Aetherwake-Setup.exe"
          $installProcess = Start-Process -FilePath $installer -ArgumentList @(
            "/S",
            "/D=$installDir"
          ) -Wait -PassThru
          if ($installProcess.ExitCode -ne 0) { throw "Installer exited with code $($installProcess.ExitCode)" }

          $exe = Join-Path $installDir "Aetherwake.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Installed Aetherwake.exe was not found" }

          npm run verify:packaged-title-audio -- "$installDir"
          if ($LASTEXITCODE -ne 0) { throw "Installed title-audio verification failed" }
          Write-Host "INSTALLED_TITLE_AUDIO=PASS"

          $env:AETHERWAKE_DESKTOP_SMOKE_MARKER = $marker
          $game = Start-Process -FilePath $exe -PassThru

          $deadline = (Get-Date).AddSeconds(20)
          while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $marker)) {
            if ($game.HasExited) {
              throw "Installed Aetherwake.exe exited before rendering a verified first frame with code $($game.ExitCode)"
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not (Test-Path -LiteralPath $marker)) {
            throw "Installed Aetherwake.exe did not report runtime-ready + first-frame within 20 seconds"
          }

          $ready = Get-Content -LiteralPath $marker -Raw | ConvertFrom-Json
          if (-not $ready.runtimeReady -or -not $ready.firstFrame) {
            throw "Desktop readiness marker did not confirm runtimeReady and firstFrame"
          }
          if ($ready.width -ne 960 -or $ready.height -ne 640) {
            throw "Desktop readiness marker reported unexpected canvas $($ready.width)x$($ready.height)"
          }
          if ($ready.setupOrder -notlike "*setup-done*") {
            throw "Desktop readiness marker did not include setup-done"
          }
          if ($game.HasExited) {
            throw "Installed Aetherwake.exe exited immediately after first-frame readiness with code $($game.ExitCode)"
          }
          Write-Host "DESKTOP_RENDER_READINESS=PASS"
          Write-Host ($ready | ConvertTo-Json -Compress)
          Stop-Process -Id $game.Id -Force
          Remove-Item Env:AETHERWAKE_DESKTOP_SMOKE_MARKER -ErrorAction SilentlyContinue

      - name: Verify packaged save survives restart
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "AetherwakeInstall"
          $exe = Join-Path $installDir "Aetherwake.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "Installed Aetherwake.exe was not found" }

          $saveProfile = Join-Path $env:RUNNER_TEMP "AetherwakeSaveSmokeProfile"
          if (Test-Path -LiteralPath $saveProfile) {
            Remove-Item -LiteralPath $saveProfile -Recurse -Force
          }
          New-Item -ItemType Directory -Path $saveProfile | Out-Null

          function Invoke-SaveSmokePhase {
            param([string]$Phase, [string]$MarkerPath)

            if (Test-Path -LiteralPath $MarkerPath) {
              Remove-Item -LiteralPath $MarkerPath -Force
            }
            $env:AETHERWAKE_SAVE_PERSISTENCE_PHASE = $Phase
            $env:AETHERWAKE_SAVE_PERSISTENCE_MARKER = $MarkerPath
            $proc = Start-Process -FilePath $exe -ArgumentList @("--user-data-dir=$saveProfile") -PassThru

            $deadline = (Get-Date).AddSeconds(20)
            while ((Get-Date) -lt $deadline -and -not (Test-Path -LiteralPath $MarkerPath)) {
              if ($proc.HasExited) {
                throw "Packaged save smoke phase '$Phase' exited before marker with code $($proc.ExitCode)"
              }
              Start-Sleep -Milliseconds 250
            }
            if (-not (Test-Path -LiteralPath $MarkerPath)) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              throw "Packaged save smoke phase '$Phase' did not report within 20 seconds"
            }

            $result = Get-Content -LiteralPath $MarkerPath -Raw | ConvertFrom-Json
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            if ($result.error) { throw "Packaged save smoke phase '$Phase' failed: $($result.error)" }
            return $result
          }

          $writeMarker = Join-Path $env:RUNNER_TEMP "aetherwake-save-write.json"
          $loadMarker = Join-Path $env:RUNNER_TEMP "aetherwake-save-load.json"

          $write = Invoke-SaveSmokePhase "write" $writeMarker
          if (-not $write.saved -or $write.storageType -ne "nw-file") {
            throw "Packaged save write did not use NW.js file persistence"
          }
          if ($write.tileX -ne 9 -or $write.tileY -ne 11) {
            throw "Packaged save write marker reported unexpected player position"
          }
          if (-not $write.savePath -or -not (Test-Path -LiteralPath $write.savePath)) {
            throw "Packaged save was not created at the reported path"
          }
          if (-not $write.backupOnlyPrimaryPath -or
              -not $write.backupOnlyBackupPath -or
              -not (Test-Path -LiteralPath $write.backupOnlyPrimaryPath) -or
              -not (Test-Path -LiteralPath $write.backupOnlyBackupPath)) {
            throw "Packaged backup-only fixture did not create both generations"
          }
          Remove-Item -LiteralPath $write.backupOnlyPrimaryPath -Force
          if (Test-Path -LiteralPath $write.backupOnlyPrimaryPath) {
            throw "Packaged backup-only fixture primary could not be removed"
          }
          if (-not (Test-Path -LiteralPath $write.backupOnlyBackupPath)) {
            throw "Packaged backup-only fixture lost its recovery backup before relaunch"
          }

          $load = Invoke-SaveSmokePhase "load" $loadMarker
          if (-not $load.restored) {
            throw "Packaged save did not restore after process restart"
          }
          if ($load.tileX -ne 9 -or $load.tileY -ne 11) {
            throw "Packaged save restored the wrong player position"
          }
          if ($load.questState -ne $write.questState) {
            throw "Packaged save restored the wrong quest state"
          }
          $writeActiveIds = @($write.activeIds)
          $loadActiveIds = @($load.activeIds)
          if ($writeActiveIds.Count -ne $loadActiveIds.Count -or
              (Compare-Object -ReferenceObject $writeActiveIds -DifferenceObject $loadActiveIds -SyncWindow 0)) {
            throw "Packaged save restored the wrong active-party membership/order"
          }
          if ($load.savePath -ne $write.savePath) {
            throw "Packaged relaunch did not use the same persistent save path"
          }
          if ($load.dataPath -ne $write.dataPath) {
            throw "Packaged relaunch did not use the same isolated NW.js data path"
          }
          if (-not $load.backupOnlyRestored) {
            throw "Packaged relaunch did not recover the backup-only save generation"
          }
          if ($load.backupOnlyTileX -ne $write.backupOnlyExpectedTileX -or
              $load.backupOnlyTileY -ne $write.backupOnlyExpectedTileY) {
            throw "Packaged backup-only recovery restored the wrong player position"
          }
          if ($load.backupOnlyQuestStateRestored -ne $write.backupOnlyQuestState) {
            throw "Packaged backup-only recovery restored the wrong quest state"
          }
          $backupWriteIds = @($write.backupOnlyActiveIds)
          $backupLoadIds = @($load.backupOnlyActiveIdsRestored)
          if ($backupWriteIds.Count -ne $backupLoadIds.Count -or
              (Compare-Object -ReferenceObject $backupWriteIds -DifferenceObject $backupLoadIds -SyncWindow 0)) {
            throw "Packaged backup-only recovery restored the wrong active-party membership/order"
          }
          if (-not $load.backupOnlyLoadedPath -or
              -not $load.backupOnlyLoadedPath.EndsWith(".bak")) {
            throw "Packaged backup-only recovery did not load from the surviving .bak path"
          }
          Write-Host "DESKTOP_SAVE_BACKUP_ONLY_RECOVERY=PASS"
          Write-Host "DESKTOP_SAVE_RESTART=PASS"
          "AETHERWAKE_RELEASE_DESKTOP_SAVE_RESTART=PASS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AETHERWAKE_RELEASE_DESKTOP_SAVE_BACKUP_ONLY_RECOVERY=PASS" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host ($load | ConvertTo-Json -Compress)
          Remove-Item Env:AETHERWAKE_SAVE_PERSISTENCE_PHASE -ErrorAction SilentlyContinue
          Remove-Item Env:AETHERWAKE_SAVE_PERSISTENCE_MARKER -ErrorAction SilentlyContinue

      - name: Verify portable package layout
        shell: pwsh
        run: |
          $portable = Join-Path $env:RUNNER_TEMP "AetherwakePortable"
          if (Test-Path -LiteralPath $portable) {
            Remove-Item -LiteralPath $portable -Recurse -Force
          }
          Expand-Archive -LiteralPath Aetherwake-Windows.zip -DestinationPath $portable
          if (-not (Test-Path -LiteralPath (Join-Path $portable "Aetherwake.exe"))) {
            throw "Portable Aetherwake.exe was not found"
          }
          npm run verify:packaged-title-audio -- "$portable"
          if ($LASTEXITCODE -ne 0) { throw "Portable title-audio verification failed" }
          Write-Host "PORTABLE_TITLE_AUDIO=PASS"

      - name: Write SHA-256 manifest
        shell: pwsh
        run: |
          $lines = foreach ($name in @("Aetherwake-Setup.exe", "Aetherwake-Windows.zip")) {
            $hash = Get-FileHash -Algorithm SHA256 -LiteralPath $name
            "$($hash.Hash.ToLower())  $name"
          }
          $lines | Set-Content -LiteralPath SHA256SUMS.txt -Encoding ASCII
          Get-Content SHA256SUMS.txt

      - name: Write release provenance evidence
        shell: pwsh
        run: |
          npm run write:release-evidence -- --installer "$PWD\Aetherwake-Setup.exe" --zip "$PWD\Aetherwake-Windows.zip" --output "$PWD\RELEASE_EVIDENCE.json"
          if ($LASTEXITCODE -ne 0) { throw "Release evidence generation failed" }

      - name: Publish verified Windows release
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: aetherwake-desktop-${{ github.sha }}
          name: Aetherwake Windows Desktop ${{ github.sha }}
          prerelease: true
          generate_release_notes: false
          files: |
            Aetherwake-Setup.exe
            Aetherwake-Windows.zip
            SHA256SUMS.txt
            RELEASE_EVIDENCE.json
