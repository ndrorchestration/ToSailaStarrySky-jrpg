name: Aetherwake player evidence log transport

on:
  push:
    branches:
      - verify/player-evidence-pr250-log-2026-10-06

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  capture-player-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout verification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify workflow-only delta
        env:
          SOURCE_SHA: 20029e03e67768495a8660e2b88c737e00b0bb6e
        run: |
          test "$(git diff --name-only "$SOURCE_SHA" HEAD)" = ".github/workflows/player-evidence.yml"

      - name: Checkout exact PR 250 source
        run: |
          git checkout --detach 20029e03e67768495a8660e2b88c737e00b0bb6e
          test "$(git rev-parse HEAD)" = "20029e03e67768495a8660e2b88c737e00b0bb6e"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify player evidence capture contract
        run: npm run test:player-evidence-capture

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture exact-source player evidence
        env:
          AETHERWAKE_PLAYER_EVIDENCE_DIR: /tmp/pr250-player-evidence
        run: npm run capture:player-evidence

      - name: Emit bounded evidence to log
        run: |
          cat /tmp/pr250-player-evidence/manifest.json
          for f in /tmp/pr250-player-evidence/*.png; do
            echo "AETHERWAKE_IMAGE_BEGIN=$(basename "$f")"
            base64 -w0 "$f"
            echo
            echo "AETHERWAKE_IMAGE_END=$(basename "$f")"
          done
