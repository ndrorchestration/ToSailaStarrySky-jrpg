name: Aetherwake player evidence

on:
  push:
    branches:
      - evidence/repo-backed-player-evidence-87550366
    paths-ignore:
      - 'evidence/player-acceptance/**'

permissions:
  contents: write

defaults:
  run:
    shell: bash

env:
  TEMPORARY_BRANCH_EXPORT_ONLY: true
  REPOSITORY_BACKED_EVIDENCE_EXPORT: true

jobs:
  capture-player-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify player evidence capture contract
        run: npm run test:player-evidence-capture

      - name: Verify repo-backed evidence export contract
        run: node tests/repo-backed-player-evidence-workflow-contract.test.js

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture player evidence
        run: npm run capture:player-evidence

      - name: Preserve acceptance boundary
        run: |
          echo "VISUAL_ACCEPTANCE=PENDING"
          echo "HUMAN_PLAYER_ACCEPTANCE=PENDING"
          echo "REVIEW_EVIDENCE_ONLY=true"

      - name: Commit evidence bundle to temporary branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f evidence/player-acceptance/
          git status --short evidence/player-acceptance/
          git commit -m "evidence: publish player review bundle for ${GITHUB_SHA}"
          git push origin HEAD:evidence/repo-backed-player-evidence-87550366
