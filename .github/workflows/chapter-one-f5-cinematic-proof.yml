name: Chapter One F5 integrated story and native visual proof (noncanon)
on:
  pull_request:
    paths:
      - "godot/scripts/first_wake_game.gd"
      - "godot/scripts/first_wake_postflight_game.gd"
      - "godot/scripts/first_wake_postflight_family_review.gd"
      - "godot/scripts/first_wake_core_alignment_*.gd"
      - "godot/scripts/first_wake_melody_*.gd"
      - "godot/scenes/first_wake_*.tscn"
      - "godot/tests/first_wake_game_entry_test.gd"
      - ".github/workflows/chapter-one-f5-cinematic-proof.yml"
permissions:
  contents: read
jobs:
  exact-f5-gl:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Checkout exact review candidate
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install checksum-pinned native Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/first-wake-godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/first-wake-godot.zip' | sha256sum -c -
          unzip -q /tmp/first-wake-godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import true F5 Godot source
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot --quit 2>&1 | tee /tmp/ch1-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error|Failed loading' /tmp/ch1-import.log
      - name: Verify real physical splashdown through complete F5 bench candidate
        shell: bash
        run: |
          set -euo pipefail
          timeout 115s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path godot --script res://tests/first_wake_game_entry_test.gd 2>&1 | tee /tmp/ch1-native.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error|TSTSS_FIRST_WAKE_GAME_ENTRY_FAIL:' /tmp/ch1-native.log
          grep -Eq 'TSTSS_FIRST_WAKE_GAME_ENTRY_PASS checks=[0-9]+ real_water_contact=true' /tmp/ch1-native.log
          grep -Fq 'harmonic_bench_candidate=true captures=0' /tmp/ch1-native.log
      - name: Capture actual complete F5 Godot chapter story frames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p godot/review-evidence
          timeout 170s xvfb-run -a -s '-screen 0 960x640x24' env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 --path godot --rendering-driver opengl3 \
            --resolution 960x640 --audio-driver Dummy --fixed-fps 60 \
            --script res://tests/first_wake_game_entry_test.gd -- --capture 2>&1 | tee /tmp/ch1-capture.log
          ! grep -Eq 'SCRIPT ERROR:|SHADER ERROR|Parse Error|TSTSS_FIRST_WAKE_GAME_ENTRY_FAIL:' /tmp/ch1-capture.log
          grep -Eq 'TSTSS_FIRST_WAKE_GAME_ENTRY_PASS checks=[0-9]+ real_water_contact=true' /tmp/ch1-capture.log
          grep -Fq 'harmonic_bench_candidate=true captures=9' /tmp/ch1-capture.log
          test "$(find godot/review-evidence -maxdepth 1 -name 'ch1-f5-*-native-960x640.png' -type f -size +0c | wc -l)" -eq 9
          sha256sum godot/review-evidence/ch1-f5-*-native-960x640.png | tee /tmp/ch1-sha256.txt
      - name: Archive exact native frames and proof receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chapter-one-f5-connected-nine-native-frames
          retention-days: 7
          if-no-files-found: warn
          path: |
            godot/review-evidence/ch1-f5-*-native-960x640.png
            /tmp/ch1-import.log
            /tmp/ch1-native.log
            /tmp/ch1-capture.log
            /tmp/ch1-sha256.txt
