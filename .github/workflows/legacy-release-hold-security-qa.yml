name: Legacy NW.js release hold — source and isolated-denial QA

on:
  pull_request:
    paths:
      - '.github/workflows/desktop-package.yml'
      - '.github/workflows/legacy-release-hold-security-qa.yml'
      - 'scripts/build-windows-release.ps1'
      - 'scripts/verify-legacy-release-hold.mjs'
      - 'tests/legacy-release-hold-safety.test.js'
      - 'docs/security/LEGACY_NWJS_RELEASE_HOLD_2026-10-26.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-and-isolated-denial-only:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - name: Checkout source without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Node.js 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'
      - name: Verify no live publisher and local refuse policy
        run: node scripts/verify-legacy-release-hold.mjs
      - name: Verify synthetic mutation and isolated PowerShell denial only
        run: node --test tests/legacy-release-hold-safety.test.js
