name: Godot First Wake Painted Coastal Sky (draft)
on:
  pull_request:
    paths:
      - 'godot/scripts/dock_depth_review.gd'
      - 'godot/tests/first_wake_painted_coast_test.gd'
      - '.github/workflows/godot-first-wake-painted-coast.yml'
permissions:
  contents: read
jobs:
  painted-coast-native-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Download verified official Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot-editor.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-editor.zip" | sha256sum -c -
          mkdir -p godot-editor
          unzip -q godot-editor.zip -d godot-editor
          chmod +x godot-editor/Godot_v4.7.2-stable_linux.x86_64
      - name: Compile actual Godot project and native shader
        shell: bash
        run: |
          set -euo pipefail
          godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit 2>&1 | tee /tmp/painted-coast-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|Shader compilation failed' /tmp/painted-coast-import.log
      - name: Validate painted coastal shader, fallback and physics isolation
        shell: bash
        run: |
          set -euo pipefail
          timeout 60s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_painted_coast_test.gd 2>&1 | tee /tmp/painted-coast-native-test.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|TSTSS_FIRST_WAKE_PAINTED_COAST_FAIL:' /tmp/painted-coast-native-test.log
          grep -Fq 'TSTSS_FIRST_WAKE_PAINTED_COAST_PASS' /tmp/painted-coast-native-test.log
      - name: Preserve real opening and water-contact gameplay
        shell: bash
        run: |
          set -euo pipefail
          timeout 105s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path godot --script res://tests/first_wake_game_entry_test.gd 2>&1 | tee /tmp/painted-coast-first-wake.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|TSTSS_FIRST_WAKE_GAME_ENTRY_FAIL:' /tmp/painted-coast-first-wake.log
          grep -Fq 'TSTSS_FIRST_WAKE_GAME_ENTRY_PASS' /tmp/painted-coast-first-wake.log
