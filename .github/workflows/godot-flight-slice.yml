name: Godot Coast-to-Highland Slice (experimental)

on:
  pull_request:
    paths:
      - "godot/flight_slice/**"
      - ".github/workflows/godot-flight-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Godot 4.7.2 editor
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Native script import and scene parse
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot/flight_slice --quit 2>&1 | tee /tmp/import.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|Failed loading' /tmp/import.log
      - name: Exercise the actual main scene for 12 headless frames
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --quit-after 12 2>&1 | tee /tmp/scene.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:|Failed loading' /tmp/scene.log
      - name: Native terrain, LOD and art study tests
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_slice.gd 2>&1 | tee /tmp/test.log
          grep -q 'GODOT_FLIGHT_SLICE_NATIVE_PASS' /tmp/test.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|GODOT_FLIGHT_SLICE_FAIL' /tmp/test.log

      - name: Measure moving terrain LOD CPU updates
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/profile_moving_lod.gd 2>&1 | tee /tmp/moving-lod.log
          grep -q 'MOVING_LOD_PROFILE_PASS' /tmp/moving-lod.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|ERROR:' /tmp/moving-lod.log

      - name: Native presentation, motion and quality contracts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_visuals.gd 2>&1 | tee /tmp/visuals.log
          grep -q 'FLIGHT_PRESENTATION_TEST_PASS' /tmp/visuals.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/visuals.log
      - name: Native cinematic shot composition and reduced-motion contracts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_cinematic_camera.gd 2>&1 | tee /tmp/cinematic-camera.log
          grep -Eq 'GODOT_CINEMATIC_CAMERA_PASS checks=[0-9]+' /tmp/cinematic-camera.log
          ! grep -Eq 'GODOT_CINEMATIC_CAMERA_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/cinematic-camera.log
      - name: Native atmospheric material and accessibility controls
        run: |
          set -o pipefail
          timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_atmosphere_contract.gd 2>&1 | tee /tmp/atmosphere-test.log
          grep -Eq 'GODOT_ATMOSPHERE_CONTRACT_PASS checks=[0-9]+' /tmp/atmosphere-test.log
          ! grep -Eq 'GODOT_ATMOSPHERE_CONTRACT_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/atmosphere-test.log
      - name: Deterministic environmental grading and motion-safe weather
        run: |
          set -o pipefail
          timeout 45s /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_environment_mood.gd 2>&1 | tee /tmp/environment-mood-test.log
          grep -Eq 'GODOT_ENVIRONMENT_MOOD_PASS checks=[0-9]+' /tmp/environment-mood-test.log
          ! grep -Eq 'GODOT_ENVIRONMENT_MOOD_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/environment-mood-test.log
      - name: Deterministic native manual Dragonfly pilot mode contracts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_manual_flight.gd 2>&1 | tee /tmp/pilot.log
          grep -Eq 'GODOT_MANUAL_FLIGHT_PASS checks=[0-9]+' /tmp/pilot.log
          ! grep -Eq 'GODOT_MANUAL_FLIGHT_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/pilot.log
      - name: Bounded physics-confirmed touchdown and takeoff native contracts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_touchdown.gd 2>&1 | tee /tmp/touchdown.log
          grep -Eq 'GODOT_TOUCHDOWN_STUDY_PASS checks=[0-9]+' /tmp/touchdown.log
          ! grep -Eq 'GODOT_TOUCHDOWN_STUDY_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/touchdown.log
      - name: Continuous native contact loss and recovery contracts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_contact_lifecycle.gd 2>&1 | tee /tmp/contact-lifecycle.log
          grep -Eq 'GODOT_CONTACT_LIFECYCLE_PASS checks=[0-9]+' /tmp/contact-lifecycle.log
          ! grep -Eq 'GODOT_CONTACT_LIFECYCLE_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/contact-lifecycle.log
      - name: Actual Godot Compatibility software-rendered frame captures
        run: |
          set -o pipefail
          timeout 120s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot/flight_slice \
            --rendering-driver opengl3 \
            --audio-driver Dummy \
            --script res://tests/capture_study.gd 2>&1 | tee /tmp/capture.log
          test "$(grep -c 'NATIVE_ART_CAPTURE:' /tmp/capture.log)" -eq 6
          grep -q 'NATIVE_PILOT_FRAME_PASS clearance=' /tmp/capture.log
          grep -q 'NATIVE_TOUCHDOWN_FRAME_PASS state=LANDED' /tmp/capture.log
          grep -Eq 'NATIVE_TOUCHDOWN_PHYSICS_FRAME_PASS triangles=792 rayHeightError=[0-9.]+' /tmp/capture.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/capture.log
      - name: Matched native GL A/B atmospheric depth captures
        run: |
          set -o pipefail
          timeout 75s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot/flight_slice \
            --rendering-driver opengl3 \
            --audio-driver Dummy \
            --script res://tests/capture_atmosphere_pair.gd 2>&1 | tee /tmp/atmosphere-capture.log
          grep -Eq 'NATIVE_ATMOSPHERE_PAIR_PASS delta=[0-9]+' /tmp/atmosphere-capture.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/atmosphere-capture.log
      - name: Matched native GL day/weather/magical-atmosphere captures
        run: |
          set -o pipefail
          timeout 90s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot/flight_slice --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/capture_environment_mood.gd 2>&1 | tee /tmp/environment-mood-capture.log
          grep -q 'NATIVE_ENVIRONMENT_CAPTURE_PASS comparisons=4' /tmp/environment-mood-capture.log
          grep -Eq 'NATIVE_MAGIC_VEIL_DELTA: [0-9.]+' /tmp/environment-mood-capture.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/environment-mood-capture.log
      - name: Profile actual rendered scripted flight sweep
        run: |
          set -o pipefail
          timeout 180s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot/flight_slice --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/profile_rendered_flight.gd 2>&1 | tee /tmp/rendered-flight.log
          grep -q 'RENDERED_SWEEP_PASS samples=96' /tmp/rendered-flight.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/rendered-flight.log
      - name: Profile rendered flight with low-quality effects
        run: |
          set -o pipefail
          timeout 180s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot/flight_slice --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/profile_rendered_flight.gd -- --low 2>&1 | tee /tmp/rendered-flight-low.log
          grep -q 'RENDERED_SWEEP_PASS samples=96 mode=low' /tmp/rendered-flight-low.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/rendered-flight-low.log
      - name: Capture native Aureate Wake ship silhouette close-ups
        run: |
          set -o pipefail
          timeout 90s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot/flight_slice --rendering-driver opengl3 --audio-driver Dummy \
            --script res://tests/capture_ship_hero.gd 2>&1 | tee /tmp/ship-hero.log
          test "$(grep -c 'NATIVE_SHIP_HERO_CAPTURE:' /tmp/ship-hero.log)" -eq 5
          grep -q 'NATIVE_SHIP_WEATHER_INTEGRATION_PASS views=5 matched_mood_comparisons=2' /tmp/ship-hero.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/ship-hero.log
      - name: Upload noncanonical native reference frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-flight-slice-software-captures
          path: |
            godot/flight_slice/evidence/**/*.png
            godot/flight_slice/evidence/*.json
            /tmp/moving-lod.log
            /tmp/rendered-flight.log
            /tmp/rendered-flight-low.log
            /tmp/import.log
            /tmp/scene.log
            /tmp/test.log
            /tmp/visuals.log
            /tmp/atmosphere-test.log
            /tmp/environment-mood-test.log
            /tmp/environment-mood-capture.log
            /tmp/atmosphere-capture.log
            /tmp/cinematic-camera.log
            /tmp/pilot.log
            /tmp/touchdown.log
            /tmp/contact-lifecycle.log
            /tmp/capture.log
            /tmp/ship-hero.log
          if-no-files-found: warn
          retention-days: 7
