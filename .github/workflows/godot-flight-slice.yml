name: Godot Coast-to-Highland Slice (experimental)

on:
  pull_request:
    paths:
      - "godot/flight_slice/**"
      - ".github/workflows/godot-flight-slice.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install exact Godot 4.7.2 editor
        run: |
          curl --fail --location --retry 3 --output /tmp/godot.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Native script import and scene parse
        run: |
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --editor --path godot/flight_slice --quit 2>&1 | tee /tmp/import.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|Failed loading' /tmp/import.log
      - name: Exercise the actual main scene for 12 headless frames
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --quit-after 12 2>&1 | tee /tmp/scene.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:|Failed loading' /tmp/scene.log
      - name: Native terrain, LOD and art study tests
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_slice.gd 2>&1 | tee /tmp/test.log
          grep -q 'GODOT_FLIGHT_SLICE_NATIVE_PASS' /tmp/test.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|GODOT_FLIGHT_SLICE_FAIL' /tmp/test.log

      - name: Native presentation, motion and quality contracts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_visuals.gd 2>&1 | tee /tmp/visuals.log
          grep -q 'FLIGHT_PRESENTATION_TEST_PASS' /tmp/visuals.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/visuals.log
      - name: Deterministic native manual Dragonfly pilot mode contracts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_manual_flight.gd 2>&1 | tee /tmp/pilot.log
          grep -Eq 'GODOT_MANUAL_FLIGHT_PASS checks=[0-9]+' /tmp/pilot.log
          ! grep -Eq 'GODOT_MANUAL_FLIGHT_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/pilot.log
      - name: Bounded sampled-terrain touchdown and takeoff native contracts
        run: |
          set -o pipefail
          /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot/flight_slice --script res://tests/test_touchdown.gd 2>&1 | tee /tmp/touchdown.log
          grep -Eq 'GODOT_TOUCHDOWN_STUDY_PASS checks=[0-9]+' /tmp/touchdown.log
          ! grep -Eq 'GODOT_TOUCHDOWN_STUDY_FAIL|SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/touchdown.log
      - name: Actual Godot Compatibility software-rendered frame captures
        run: |
          set -o pipefail
          timeout 120s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/Godot_v4.7.2-stable_linux.x86_64 \
            --path godot/flight_slice \
            --rendering-driver opengl3 \
            --audio-driver Dummy \
            --script res://tests/capture_study.gd 2>&1 | tee /tmp/capture.log
          test "$(grep -c 'NATIVE_ART_CAPTURE:' /tmp/capture.log)" -eq 6
          grep -q 'NATIVE_PILOT_FRAME_PASS clearance=' /tmp/capture.log
          grep -q 'NATIVE_TOUCHDOWN_FRAME_PASS state=LANDED' /tmp/capture.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/capture.log
      - name: Upload noncanonical native reference frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-flight-slice-software-captures
          path: godot/flight_slice/evidence/**/*.png
          if-no-files-found: warn
          retention-days: 7
