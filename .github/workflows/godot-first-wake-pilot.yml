name: Godot Native First Wake Pilot (review only)
on:
  push:
    branches: [pilot/godot-4-7-2-first-wake-20261021]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-first-wake-pilot.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-first-wake-pilot.yml'
permissions:
  contents: read
jobs:
  godot-native-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Godot pilot without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify native Windows preview package safety contract
        shell: bash
        run: node tests/godot-windows-preview-package-contract.test.js
      - name: Verify exact Windows native QA safety contract
        shell: bash
        run: node tests/godot-windows-native-qa-contract.test.js
      - name: Verify lossless native-crop log decoder fails closed
        shell: bash
        run: python3 godot/tests/test_private_crop_decoder.py
      - name: Verify creator-approved Ender appearance bytes (source only, not art admission)
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/tests/verify_ender_provenance.py
          sha256sum godot/art-review/ender-approved-reference.png
      - name: Fetch digest-verified official Godot 4.7.2 Standard binary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot-editor.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-editor.zip" | sha256sum -c -
          mkdir -p godot-editor
          unzip -q godot-editor.zip -d godot-editor
          chmod +x godot-editor/Godot_v4.7.2-stable_linux.x86_64
      - name: Import/check real GDScript scenes with Godot headless editor
        shell: bash
        run: |
          set -euo pipefail
          godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Execute real native SceneTree smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/smoke_test.gd
      - name: Verify opt-in Ender movement animation
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/ender_walk_test.gd
      - name: Verify two original Ionia source slots and reversible native comparison
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/ionia_alignment_test.gd
      - name: Verify actual authored four-way Ender and Ionia contact-phase traversal
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/directional_walk_review_test.gd
      - name: Verify opt-in physical dock depth without changing map authority
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/dock_depth_review_test.gd
      - name: Verify all authored Ionia views and four-leg real movement
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/ionia_four_direction_test.gd
      - name: Verify isolated player-choice state gates and consequences
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/vertical_slice_choice_state_test.gd
      - name: Verify packaged First Wake Chapter I migration state machine
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_state_test.gd
      - name: Verify production JRPG stat model parity
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/jrpg_stat_model_test.gd
      - name: Verify authorized production JRPG formula subset
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_combat_formula_test.gd
      - name: Verify playable production-formula review encounter controller
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_formula_encounter_test.gd
      - name: Verify production-formula review inside native Chapter I scene
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_formula_encounter_scene_test.gd
      - name: Verify First Wake party combat authority remains fail closed
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_party_combat_authority_test.gd
      - name: Verify current-story Wind Shear enemy adapter
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_current_enemy_adapter_test.gd
      - name: Verify authored Wind Shear retaliation and fail-closed player defeat
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_wind_shear_retaliation_test.gd
      - name: Verify authored Wind Shear combat advances Crossing only after confirmed clear
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_wind_shear_combat_scene_test.gd
      - name: Verify packaged First Wake Chapter I authored content and legacy epilogue semantics
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_content_test.gd
      - name: Verify packaged First Wake authored dialogue cursor
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_dialogue_test.gd
      - name: Verify real First Wake authored dialogue gates scene progress
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_dialogue_scene_test.gd
      - name: Verify First Wake Chapter I save codec
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_save_codec_test.gd
      - name: Verify real First Wake Chapter I save restore boundary
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_save_scene_test.gd
      - name: Verify local First Wake Chapter I save store and recovery
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_save_store_test.gd
      - name: Verify real-scene local save/load and backup recovery
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_save_store_scene_test.gd
      - name: Verify real First Wake Chapter I migration scene
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_review_test.gd
      - name: Verify review-only Windows preview export surface
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_export_contract.gd
      - name: Verify real opt-in First Wake vertical-slice scene
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/vertical_slice_review_test.gd
      - name: Verify slice accessibility defaults, privacy and safe retry
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/vertical_slice_accessibility_test.gd
      - name: Verify asset-independent echo counterplay
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/vertical_slice_echo_encounter_test.gd
      - name: Verify asset-independent contextual prompts
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/vertical_slice_prompt_model_test.gd
      - name: Verify named keyboard/controller defaults preserve remaps
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/vertical_slice_input_policy_test.gd
      - name: Verify original procedural signal audio
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/vertical_slice_signal_audio_test.gd

      - name: Verify five-affinity cinematic spell visuals remain isolated and motion-safe
        shell: bash
        run: |
          set -euo pipefail
          godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/magic_vfx_contract_test.gd 2>&1 | tee /tmp/magic-vfx-contract.log
          grep -q 'STARRY_SKY_MAGIC_VFX_PASS' /tmp/magic-vfx-contract.log
          ! grep -Eq 'STARRY_SKY_MAGIC_VFX_FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/magic-vfx-contract.log

      - name: Verify physical 2D light and occlusion pilot remains non-executable
        shell: bash
        run: |
          set -euo pipefail
          godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/magic_vfx_environment_contract_test.gd 2>&1 | tee /tmp/magic-environment-contract.log
          grep -q 'STARRY_SKY_MAGIC_ENVIRONMENT_PASS' /tmp/magic-environment-contract.log
          ! grep -Eq 'STARRY_SKY_MAGIC_ENVIRONMENT_FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/magic-environment-contract.log
