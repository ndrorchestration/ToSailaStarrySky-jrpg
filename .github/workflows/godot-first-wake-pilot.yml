name: Godot Native First Wake Pilot (review only)
on:
  push:
    branches: [pilot/godot-4-7-2-first-wake-20261021]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-first-wake-pilot.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-first-wake-pilot.yml'
permissions:
  contents: read
jobs:
  godot-native-headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout isolated Godot pilot without persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify native Windows preview package safety contract
        shell: bash
        run: node tests/godot-windows-preview-package-contract.test.js
      - name: Verify exact Windows native QA safety contract
        shell: bash
        run: node tests/godot-windows-native-qa-contract.test.js
      - name: Verify lossless native-crop log decoder fails closed
        shell: bash
        run: python3 godot/tests/test_private_crop_decoder.py
      - name: Verify creator-approved Ender appearance bytes (source only, not art admission)
        shell: bash
        run: |
          set -euo pipefail
          python3 godot/tests/verify_ender_provenance.py
          sha256sum godot/art-review/ender-approved-reference.png
      - name: Fetch digest-verified official Godot 4.7.2 Standard binary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot-editor.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-editor.zip" | sha256sum -c -
          mkdir -p godot-editor
          unzip -q godot-editor.zip -d godot-editor
          chmod +x godot-editor/Godot_v4.7.2-stable_linux.x86_64
      - name: Import/check real GDScript scenes with Godot headless editor
        shell: bash
        run: |
          set -euo pipefail
          godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Execute real native SceneTree smoke test
        shell: bash
        run: |
          set -euo pipefail
          godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/smoke_test.gd
      - name: Verify opt-in Ender movement animation
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/ender_walk_test.gd
      - name: Verify two original Ionia source slots and reversible native comparison
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/ionia_alignment_test.gd
      - name: Verify actual authored four-way Ender and Ionia contact-phase traversal
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/directional_walk_review_test.gd
      - name: Verify opt-in physical dock depth without changing map authority
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/dock_depth_review_test.gd
      - name: Verify all authored Ionia views and four-leg real movement
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/ionia_four_direction_test.gd
      - name: Verify isolated player-choice state gates and consequences
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/vertical_slice_choice_state_test.gd
      - name: Verify packaged First Wake Chapter I migration state machine
        shell: bash
        run: godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_chapter1_state_test.gd
      - name: Verify design-only Resonance catalog cannot execute
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 35s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/party_resonance_catalog_test.gd
      - name: Verify shared formula and Resonance metadata is nonauthorizing
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 35s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/combat_ability_contract_test.gd
      - name: Verify dual and triple atomic review reservation planner
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 35s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/party_action_reservation_test.gd
      - name: Verify exact review-only Resonance grant provenance
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 35s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/resonance_review_grant_policy_test.gd
      - name: Verify isolated Tidebound Promise turn transaction
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 35s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/tidebound_promise_review_test.gd
      - name: Verify 24-case dual-target Tidebound damage conservation
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 35s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/tidebound_damage_sweep_test.gd
      - name: Verify opt-in playable Tidebound review scene controls
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 35s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/resonance_dual_review_scene_test.gd
      - name: Verify opt-in F8 link from real default Chapter I to revised opening and exact memory-only return
        shell: bash
        run: |
          set -euo pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          timeout --kill-after=3s 45s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_prototype_entry_route_test.gd 2>&1 | tee "$log_file"
          # Godot can print a GDScript runtime ERROR and still quit(0); the
          # route may only be called verified when the full log is clean.
          if grep -Eq 'SCRIPT ERROR|TSTSS_FIRST_WAKE_PROTO_ENTRY_FAIL' "$log_file"; then
            echo "Prototype navigation has a Godot runtime error" >&2
            exit 1
          fi
          grep -Fq 'TSTSS_FIRST_WAKE_PROTO_ENTRY_PASS:' "$log_file"
      - name: Verify v2 revised opening checkpoint codec cannot read or mutate legacy Chapter I saves
        shell: bash
        run: |
          set -euo pipefail
          timeout --kill-after=3s 35s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_revised_checkpoint_codec_test.gd
      - name: Verify real Ionia-first scene v2 checkpoint save, backup recovery and no Art grants
