          timeout --kill-after=3s 25s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_resonance_roster_gate_test.gd
      - name: Verify post-splashdown material recovery and Captain's melodic core alignment review contract
