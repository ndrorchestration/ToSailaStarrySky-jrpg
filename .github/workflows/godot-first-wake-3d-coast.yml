name: Godot First Wake 3D Coastal Slice (review)
on:
  pull_request:
    paths:
      - 'godot/scenes/first_wake_3d_visual_slice.tscn'
      - 'godot/scripts/first_wake_3d_visual_slice.gd'
      - 'godot/scripts/first_wake_3d_character_slot.gd'
      - 'godot/shaders/first_wake_3d_water.gdshader'
      - 'godot/tests/first_wake_3d_visual_slice_test.gd'
      - 'godot/tests/capture_first_wake_3d_visual_slice.gd'
      - '.github/workflows/godot-first-wake-3d-coast.yml'
permissions:
  contents: read
jobs:
  real-3d-native-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Reject private artist-source assets in public repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-files | grep -E '^godot/art-review/(private-3d|creator-motion-private|creator-portrait-preview|creator-field-review)/' || true)"
          test -f godot/scenes/first_wake_3d_visual_slice.tscn
          grep -Fq 'run/main_scene="res://scenes/first_wake_game.tscn"' godot/project.godot
      - name: Install SHA-256 pinned official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o godot-editor.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  godot-editor.zip" | sha256sum -c -
          mkdir -p godot-editor
          unzip -q godot-editor.zip -d godot-editor
          chmod +x godot-editor/Godot_v4.7.2-stable_linux.x86_64
      - name: Import true 3D scene and materials in actual Godot editor
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit 2>&1 | tee /tmp/first-wake-3d-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:' /tmp/first-wake-3d-import.log
      - name: Validate real geometry, shaders, 3D camera, import slots and original game isolation
        shell: bash
        run: |
          set -euo pipefail
          timeout 80s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path godot --script res://tests/first_wake_3d_visual_slice_test.gd 2>&1 | tee /tmp/first-wake-3d-structure.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|TSTSS_3D_SLICE_FAIL:' /tmp/first-wake-3d-structure.log
          grep -Fq 'TSTSS_3D_SLICE_PASS' /tmp/first-wake-3d-structure.log
      - name: Render actual spatial 3D camera with Mesa OpenGL
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          timeout 100s xvfb-run -a -s "-screen 0 960x640x24" godot-editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_first_wake_3d_visual_slice.gd 2>&1 | tee /tmp/first-wake-3d-native-frame.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|TSTSS_3D_NATIVE_CAPTURE_FAIL:' /tmp/first-wake-3d-native-frame.log
          grep -Fq 'TSTSS_3D_NATIVE_CAPTURE_PASS' /tmp/first-wake-3d-native-frame.log
      - name: Regression — original First Wake playable landing and saves
        shell: bash
        run: |
          set -euo pipefail
          timeout 100s godot-editor/Godot_v4.7.2-stable_linux.x86_64 --headless --fixed-fps 60 --path godot --script res://tests/first_wake_game_entry_test.gd 2>&1 | tee /tmp/first-wake-2d-regression.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error:|TSTSS_FIRST_WAKE_GAME_ENTRY_FAIL:' /tmp/first-wake-2d-regression.log
          grep -Fq 'TSTSS_FIRST_WAKE_GAME_ENTRY_PASS' /tmp/first-wake-2d-regression.log
