name: Godot Native Ionia Render Review (private draft only)
on:
  push:
    branches: [pilot/godot-ionia-review-20261021]
    paths:
      - 'godot/**'
      - '.github/workflows/godot-visual-review-capture.yml'
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-visual-review-capture.yml'
permissions:
  contents: read
jobs:
  native-scene-capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout review branch with no persisted credentials
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Fetch pinned official Godot 4.7.2 editor binary
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL "https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip" -o editor.zip
          echo "cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  editor.zip" | sha256sum -c -
          mkdir -p editor
          unzip -q editor.zip -d editor
          chmod +x editor/Godot_v4.7.2-stable_linux.x86_64
      - name: Import exact review art in native engine
        shell: bash
        run: |
          set -euo pipefail
          editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Render authentic 960x640 baseline, original and two-character alignment comparison
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          mkdir -p godot/review-evidence
          xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_native_ionia_review.gd
          test -s godot/review-evidence/ionia-baseline-native-960x640.png
          test -s godot/review-evidence/ionia-svg-review-native-960x640.png
          test -s godot/review-evidence/ionia-original-with-ender-native-960x640.png
          test -s godot/review-evidence/ionia-alignment-with-ender-native-960x640.png
          xvfb-run -a -s " -screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_directional_walk_review.gd
          test -s godot/review-evidence/ender-south-actual-native-960x640.png
          test -s godot/review-evidence/ender-north-actual-native-960x640.png
          test -s godot/review-evidence/ionia-sixphase-moving-native-960x640.png
          test -s godot/review-evidence/ionia-sixphase-stopped-native-960x640.png
          xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_dock_depth_review.gd
          test -s godot/review-evidence/dock-original-native-960x640.png
          test -s godot/review-evidence/dock-depth-review-native-960x640.png
          test -s godot/review-evidence/dock-depth-both-actors-moving-native-960x640.png
          xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_ionia_four_way_review.gd
          test -s godot/review-evidence/ionia-south-route-native-960x640.png
          test -s godot/review-evidence/ionia-west-route-native-960x640.png
          test -s godot/review-evidence/ionia-north-route-native-960x640.png
          test -s godot/review-evidence/ionia-east-route-native-960x640.png
          xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_ender_staff_review.gd
          test -s godot/review-evidence/ender-east-original-source-native-960x640.png
          test -s godot/review-evidence/ender-west-centered-staff-native-960x640.png
          # Quota-independent, private, size-capped 480x320 lossy inspection
          # payloads are logged separately from the authoritative full-size PNGs.
          xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/emit_private_native_preview.gd
          # Controlled A/B: four native Ender+Ionia directions, same positions/deck.
          xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_joint_fourway_fixed_scene.gd
          for direction in east west south north; do
            test -s "godot/review-evidence/joint-fixed-${direction}-native-960x640.png"
          done
          test -s godot/review-evidence/joint-fixed-baseline-native-960x640.png
          # Three real playability-study frames; do not promote to canonical art.
          xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_vertical_slice_review.gd
          for phase in discovery dialogue-choice dialogue-history encounter-warning echo-ready beacon-payoff; do
            test -s "godot/review-evidence/slice-${phase}-native-960x640.png"
          done
          sha256sum godot/review-evidence/*.png
          # Private, native-resolution lossless crops in job logs: not a public artifact.
          # Entire 960x640 PNGs remain runner-only; do not conflate crop custody with full frames.
          editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/emit_lossless_native_crops.gd
      - name: Capture five genuine Chapter I native 3D inset frames across physical splashdown
        shell: bash
        run: |
          set -euo pipefail
          xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_first_wake_3d_inset.gd 2>&1 | tee /tmp/first-wake-3d-capture.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error|TSTSS_FIRST_WAKE_3D_CAPTURE_FAIL:' /tmp/first-wake-3d-capture.log
          grep -Fq 'TSTSS_FIRST_WAKE_3D_CAPTURE_PASS frames=5' /tmp/first-wake-3d-capture.log
          for frame in 01-preflight-bow-real-3d 02-ascent-planform-real-3d 03-warning-stern-real-3d 04-descent-bow-real-3d 05-waterborne-stern-real-3d; do
            test -s "godot/review-evidence/first-wake-3d/${frame}.png"
          done
          sha256sum godot/review-evidence/first-wake-3d/*.png
      - name: Render six genuine wide-screen 3D and 2D fallback review states
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_first_wake_wide_composition.gd 2>&1 | tee /tmp/first-wake-wide-capture.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error|TSTSS_FIRST_WAKE_WIDE_CAPTURE_FAIL:' /tmp/first-wake-wide-capture.log
          grep -Fq 'TSTSS_FIRST_WAKE_WIDE_CAPTURE_PASS frames=6' /tmp/first-wake-wide-capture.log
          for frame in 01-preflight-bow-wide-3d 02-ascent-planform-wide-3d 03-warning-stern-wide-3d 04-descent-bow-wide-3d 05-waterborne-stern-wide-3d 06-waterborne-2d-fallback; do
            test -s "godot/review-evidence/first-wake-wide-3d/${frame}.png"
          done
          sha256sum godot/review-evidence/first-wake-wide-3d/*.png
      - name: Capture original neutral warning on real wide 3D and matched off/interrupt
        shell: bash
        run: |
          set -euo pipefail
          timeout 115s xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_first_wake_wide_warning_vfx.gd 2>&1 | tee /tmp/wide-pw01-gl.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error|TSTSS_WIDE_WARNING_CAPTURE_FAIL:' /tmp/wide-pw01-gl.log
          grep -Fq 'TSTSS_FIRST_WAKE_WIDE_WARNING_CAPTURE_PASS frames=6' /tmp/wide-pw01-gl.log
          grep -Fq 'TSTSS_WIDE_WARNING_GL_AB_PASS: on_off_distinct=true off_interrupt_identical=true' /tmp/wide-pw01-gl.log
          for name in 01-preflight 02-warning-on 03-warning-off 04-warning-interrupted 05-descent 06-waterborne; do
            test -s "godot/review-evidence/first-wake-wide-warning/${name}.png"
          done
          sha256sum godot/review-evidence/first-wake-wide-warning/*.png
      - name: Capture live cinematic shipboard environment after authentic splashdown
        shell: bash
        run: |
          set -euo pipefail
          timeout 125s xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_first_wake_cinematic_deck.gd 2>&1 | tee /tmp/first-wake-cinematic-deck-render.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error|TSTSS_CINEMATIC_DECK_CAPTURE_FAIL:' /tmp/first-wake-cinematic-deck-render.log
          grep -Fq 'TSTSS_CINEMATIC_DECK_CAPTURE_PASS frames=3 native_gl=true' /tmp/first-wake-cinematic-deck-render.log
          for frame in 01-real-postflight-depleted-reserve 02-interactive-reserve-inspected 03-reduced-motion-still-sea; do
            test -s "godot/review-evidence/first-wake-cinematic-deck/${frame}.png"
          done
          sha256sum godot/review-evidence/first-wake-cinematic-deck/*.png
      - name: Capture three genuine live local-berth gameplay frames after original physical splashdown
        shell: bash
        run: |
          set -euo pipefail
          timeout 155s xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_first_wake_local_berth_game.gd 2>&1 | tee /tmp/first-wake-local-berth-gl.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error|TSTSS_BERTH_GL_FAIL:' /tmp/first-wake-local-berth-gl.log
          grep -Fq 'TSTSS_BERTH_GL_CAPTURE_PASS frames=3 genuine_gl=true' /tmp/first-wake-local-berth-gl.log
          for img in 01-player-command-before-approach 02-independent-physical-berth-contact 03-player-secured-safe-local-berth; do
            test -s "godot/review-evidence/first-wake-playable-berth/${img}.png"
          done
          sha256sum godot/review-evidence/first-wake-playable-berth/*.png
      - name: Capture actual First Wake local berth physics to Lyra/Talen family scene
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s xvfb-run -a -s "-screen 0 960x640x24" editor/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_first_wake_physical_family_bridge.gd 2>&1 | tee /tmp/first-wake-physical-family-capture.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error|TSTSS_PHYSICAL_FAMILY_GL_FAIL:' /tmp/first-wake-physical-family-capture.log
          grep -Fq 'TSTSS_PHYSICAL_FAMILY_GL_CAPTURE_PASS frames=5 genuine_gl=true' /tmp/first-wake-physical-family-capture.log
          for frame in 01-player-command-before-approach 02-independent-physical-berth-contact 03-player-secured-safe-local-berth 04-authentic-safe-family-arrival 05-player-greeted-lyra-investigation; do
            test -s "godot/review-evidence/first-wake-physical-family/${frame}.png"
          done
          sha256sum godot/review-evidence/first-wake-physical-family/*.png
      - name: Mark capture as not externally retrievable (Actions artifact quota)
        shell: bash
        run: |
          set -euo pipefail
          echo "GODOT_NATIVE_RENDER_CAPTURE=PASS_LOCAL_RUNNER"
          echo "GODOT_NATIVE_CAPTURE_HASHES=LOGGED"
          echo "GODOT_NATIVE_CAPTURE_DISTRIBUTION=BLOCKED_ACTIONS_ARTIFACT_STORAGE_QUOTA"
          echo "GODOT_NATIVE_VISUAL_ACCEPTANCE=NOT_ESTABLISHED"
          # No upload/publish action: keep private review work fail-closed.
