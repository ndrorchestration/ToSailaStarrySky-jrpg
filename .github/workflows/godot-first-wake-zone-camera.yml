name: Godot First Wake Zone Camera and Crew Motion (study)

on:
  pull_request:
    paths:
      - 'godot/scripts/first_wake_3d_zone_camera_review.gd'
      - 'godot/scripts/first_wake_3d_crew_motion_proxy.gd'
      - 'godot/scripts/first_wake_opt_in_shipboard_3d_review.gd'
      - 'godot/tests/first_wake_3d_zone_camera_crew_test.gd'
      - 'godot/tests/capture_first_wake_3d_zone_camera.gd'
      - 'docs/FIRST_WAKE_ZONE_CAMERA_CREW_REVIEW_2026-10-28.md'
      - '.github/workflows/godot-first-wake-zone-camera.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  first-wake-zone-camera:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Check out exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Download SHA-pinned official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/editor.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/editor.zip' | sha256sum -c -
          mkdir -p /tmp/editor
          unzip -q /tmp/editor.zip -d /tmp/editor
          chmod +x /tmp/editor/Godot_v4.7.2-stable_linux.x86_64
          /tmp/editor/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Native Godot project import of actual visual/camera scripts
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s /tmp/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit 2>&1 | tee /tmp/zone-camera-import.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|SHADER ERROR|Failed loading' /tmp/zone-camera-import.log
      - name: Verify zone follow real walking animation, collision camera and save
        shell: bash
        run: |
          set -euo pipefail
          timeout 125s /tmp/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_3d_zone_camera_crew_test.gd 2>&1 | tee /tmp/zone-camera-test.log
          grep -q 'FIRST_WAKE_ZONE_CAMERA_PASS' /tmp/zone-camera-test.log
          grep -q 'real_camera=ZONE_AWARE crew=ANIMATED_PROXY occlusion=PHYSICS story=UNCHANGED production=BLOCKED' /tmp/zone-camera-test.log
          ! grep -Eq 'FIRST_WAKE_ZONE_CAMERA_FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/zone-camera-test.log
      - name: Render four actual native Godot camera / actor frames
        shell: bash
        run: |
          set -euo pipefail
          timeout 145s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 /tmp/editor/Godot_v4.7.2-stable_linux.x86_64 --path godot --rendering-driver opengl3 --audio-driver Dummy --script res://tests/capture_first_wake_3d_zone_camera.gd 2>&1 | tee /tmp/zone-camera-render.log
          test "$(grep -c 'FIRST_WAKE_ZONE_CAMERA_FRAME:' /tmp/zone-camera-render.log)" -eq 4
          grep -q 'FIRST_WAKE_ZONE_CAMERA_RENDER_PASS' /tmp/zone-camera-render.log
          ! grep -Eq 'FIRST_WAKE_ZONE_CAMERA_CAPTURE_FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/zone-camera-render.log
      - name: Preserve raw screenshots, import and physics receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-wake-zone-camera-real-crew-proof
          path: |
            godot/review-evidence/first-wake-3d-zone-camera/*.png
            /tmp/zone-camera-import.log
            /tmp/zone-camera-test.log
            /tmp/zone-camera-render.log
          retention-days: 7
          if-no-files-found: warn
