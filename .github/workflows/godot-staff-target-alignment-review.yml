name: Godot staff target alignment review
on:
  push:
    branches: [feat/godot-staff-target-alignment-visual-20261027]
    paths:
      - 'godot/scripts/ender_staff_target_alignment_review.gd'
      - 'godot/scripts/ender_staff_combat_keyframe_review.gd'
      - 'godot/tests/ender_staff_combat_keyframe_review_test.gd'
      - 'godot/scripts/weapon_directional_cinematic_review.gd'
      - 'godot/scripts/weapon_combat_pose_review.gd'
      - 'godot/tests/ender_staff_target_alignment_review_test.gd'
      - 'godot/tests/capture_ender_staff_target_alignment.gd'
      - '.github/workflows/godot-staff-target-alignment-review.yml'
  pull_request:
    paths:
      - 'godot/scripts/ender_staff_target_alignment_review.gd'
      - 'godot/scripts/ender_staff_combat_keyframe_review.gd'
      - 'godot/tests/ender_staff_combat_keyframe_review_test.gd'
      - 'godot/scripts/weapon_directional_cinematic_review.gd'
      - 'godot/scripts/weapon_combat_pose_review.gd'
      - 'godot/tests/ender_staff_target_alignment_review_test.gd'
      - 'godot/tests/capture_ender_staff_target_alignment.gd'
      - '.github/workflows/godot-staff-target-alignment-review.yml'
permissions:
  contents: read
jobs:
  native-contact-visual-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Obtain digest-verified Godot 4.7.2 official standard editor
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o editor.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  editor.zip' | sha256sum -c -
          unzip -q editor.zip
          chmod +x Godot_v4.7.2-stable_linux.x86_64
      - name: Import source and verify native scene
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Native inherited mastery, choreography, actor-authority and 20-combat-beat regressions
        shell: bash
        run: |
          set -euo pipefail
          for test in weapon_skill_tree_review_test weapon_choreography_review_test weapon_battle_visual_adapter_test weapon_directional_cinematic_review_test ender_staff_combat_keyframe_review_test; do
            ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script "res://tests/${test}.gd"
          done
      - name: Native exact-head four-facing ferrule alignment and security guards
        run: ./Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/ender_staff_target_alignment_review_test.gd
      - name: Render 13 native 960x640 frames and contact-only lossy inspection sheet
        shell: bash
        run: |
          set -euo pipefail
          command -v xvfb-run
          mkdir -p godot/review-evidence
          xvfb-run -a -s "-screen 0 960x640x24" ./Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --resolution 960x640 --path godot --script res://tests/capture_ender_staff_target_alignment.gd
          test "$(find godot/review-evidence -name 'staff-target-*-960x640.png' | wc -l)" -eq 13
          sha256sum godot/review-evidence/staff-target-*-960x640.png
          echo "TRAINING_DISK_ALIGNMENT=RENDERED_VISUAL_ONLY"
          echo "COMBAT_EXECUTION_OR_HITBOX=FALSE"
          echo "AUTHOR_APPROVAL_OR_PRODUCTION_ART=NOT_ESTABLISHED"
          echo "PNG_EVIDENCE_CUSTODY=RUNNER_ONLY"
