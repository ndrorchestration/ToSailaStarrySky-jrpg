name: Chapter I 3D and RPG Cohesion (review only)
on:
  pull_request:
    paths:
      - 'godot/tests/first_wake_cross_system_cohesion_test.gd'
      - 'docs/reviews/CH1_3D_RPG_SYSTEM_COHESION_2026-10-28.md'
      - '.github/workflows/first-wake-cross-system-cohesion.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install hash-pinned official Godot
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          mkdir -p /tmp/godot
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
      - name: Native story-stat-combat authority gate
        shell: bash
        run: |
          set -euo pipefail
          timeout 85s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit 2>&1 | tee /tmp/cohesion-import.log
          ! grep -Eq 'SCRIPT ERROR:|Parse Error' /tmp/cohesion-import.log
          timeout 85s /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_cross_system_cohesion_test.gd 2>&1 | tee /tmp/cohesion-test.log
          grep -Fq 'TSTSS_CH1_COHESION_PASS' /tmp/cohesion-test.log
          ! grep -Eq 'TSTSS_CH1_COHESION_FAIL:|SCRIPT ERROR:|Parse Error' /tmp/cohesion-test.log
