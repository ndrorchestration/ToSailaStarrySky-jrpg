name: Godot Aureate Wake Maritime Deck Architecture (prototype)

on:
  pull_request:
    paths:
      - 'godot/scripts/aureate_wake_deck_trim_review.gd'
      - 'godot/scripts/aureate_wake_metric_bridge_study.gd'
      - 'godot/tests/aureate_wake_deck_architecture_test.gd'
      - 'godot/tests/capture_aureate_wake_architecture.gd'
      - 'docs/AUREATE_WAKE_DECK_ARCHITECTURE_2026-10-28.md'
      - '.github/workflows/godot-aureate-wake-deck-architecture.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-maritime-architecture:
    runs-on: ubuntu-24.04
    timeout-minutes: 13
    steps:
      - name: Checkout exact source
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Verify official Godot 4.7.2
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 -fsSL 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip' -o /tmp/godot.zip
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          mkdir -p /tmp/editor
          unzip -q /tmp/godot.zip -d /tmp/editor
          chmod +x /tmp/editor/Godot_v4.7.2-stable_linux.x86_64
          /tmp/editor/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Import scene and enforce GDScript compilation
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s /tmp/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit 2>&1 | tee /tmp/architecture-import.log
          ! grep -Eq 'SCRIPT ERROR|Parse Error|Failed loading|SHADER ERROR' /tmp/architecture-import.log
      - name: Test real guard physics, shape occupancy and helm sightline
        shell: bash
        run: |
          set -euo pipefail
          timeout 110s /tmp/editor/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/aureate_wake_deck_architecture_test.gd 2>&1 | tee /tmp/architecture-test.log
          grep -q 'AUREATE_WAKE_ARCHITECTURE_PASS' /tmp/architecture-test.log
          grep -q 'guard_collision=UNCHANGED walk_stations=REVIEW_ONLY art=TIMBER_BRASS production=BLOCKED' /tmp/architecture-test.log
          ! grep -Eq 'AUREATE_WAKE_ARCHITECTURE_FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/architecture-test.log
      - name: Render real identical-camera visual A/B
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 /tmp/editor/Godot_v4.7.2-stable_linux.x86_64 --path godot --rendering-driver opengl3 --audio-driver Dummy --script res://tests/capture_aureate_wake_architecture.gd 2>&1 | tee /tmp/architecture-gl.log
          test "$(grep -c 'AUREATE_WAKE_ARCHITECTURE_NATIVE_FRAME:' /tmp/architecture-gl.log)" -eq 3
          grep -q 'AUREATE_WAKE_ARCHITECTURE_RENDER_PASS' /tmp/architecture-gl.log
          ! grep -Eq 'AUREATE_WAKE_ARCHITECTURE_CAPTURE_FAIL|SCRIPT ERROR|Parse Error|ERROR:' /tmp/architecture-gl.log
      - name: Preserve native screenshots and receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aureate-wake-maritime-architecture-native-proof
          path: |
            godot/review-evidence/aureate-wake-architecture/*.png
            /tmp/architecture-import.log
            /tmp/architecture-test.log
            /tmp/architecture-gl.log
          if-no-files-found: warn
          retention-days: 7
