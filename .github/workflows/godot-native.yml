name: Godot-native migration
on:
  push:
    branches:
      - migration/godot-native-first-20261024
  pull_request:
    paths:
      - 'godot/**'
      - '.github/workflows/godot-native.yml'
      - 'docs/GODOT_MIGRATION.md'

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 Standard (no Node/npm)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --silent --show-error \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --version
      - name: Import native project and GDScript
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --editor --quit
      - name: Planetary geometry parity (native)
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/planetary_geometry_test.gd
      - name: Geodesic flight parity (native)
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/planetary_flight_test.gd
      - name: First Wake party authority (native)
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/first_wake_party_combat_authority_test.gd
      - name: Native planet scene construction smoke
        run: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 --headless --path godot --script res://tests/planetary_scene_smoke.gd
