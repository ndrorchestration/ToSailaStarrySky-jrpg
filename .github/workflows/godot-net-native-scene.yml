name: Godot 4.7.2 .NET native C# globe scene (noncanon)
on:
  pull_request:
    paths:
      - 'native-csharp/GodotWorldMapStudy/**'
      - '.github/workflows/godot-net-native-scene.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-godot-csharp-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install official .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install official Godot 4.7.2 Mono editor
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --output /tmp/godot_mono.zip \
            https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable/Godot_v4.7.2-stable_mono_linux_x86_64.zip
          mkdir -p /tmp/godot_mono
          unzip -q /tmp/godot_mono.zip -d /tmp/godot_mono
          GODOT="$(find /tmp/godot_mono -type f -name 'Godot_v4.7.2-stable_mono_linux.x86_64' -print -quit)"
          test -n "$GODOT"
          chmod +x "$GODOT"
          echo "GODOT_BIN=$GODOT" >> "$GITHUB_ENV"
          "$GODOT" --version
          dotnet --version
      - name: Compile real Godot C# scene with warnings as errors
        working-directory: native-csharp/GodotWorldMapStudy
        shell: bash
        run: |
          set -euo pipefail
          dotnet restore StarrySkyWorldMapStudy.csproj
          dotnet build StarrySkyWorldMapStudy.csproj -c Debug --no-restore -warnaserror
      - name: Godot Mono import and native scene smoke
        shell: bash
        run: |
          set -euo pipefail
          "$GODOT_BIN" --headless --audio-driver Dummy --editor --path native-csharp/GodotWorldMapStudy --quit 2>&1 | tee /tmp/dotnet-import.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:' /tmp/dotnet-import.log
          "$GODOT_BIN" --headless --audio-driver Dummy --path native-csharp/GodotWorldMapStudy --quit-after 150 2>&1 | tee /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_WORLD_PASS' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_ATOMIC_REJECT_PASS intactTiles=9' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_STALE_REJECT_PASS stale=1 current=2' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_SUPERSESSION_PASS requests=10 staleRejected=9 current=10' /tmp/dotnet-world.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('/tmp/dotnet-world.log').read_text()
          rows=re.findall(r'GODOT_CSHARP_SWAP_METRIC nodes=(\d+) commitMs=([0-9.]+)', log)
          assert len(rows)==3, rows
          assert [int(row[0]) for row in rows] == [9,12,9], rows
          assert all(float(row[1])>=0 for row in rows), rows
          print('GODOT_CSHARP_SWAP_TELEMETRY_PASS',rows)
          PY
          grep -q 'GODOT_CSHARP_STREAM_ADMIT_PASS revision=1 tiles=12 maxPerFrame=2 observed=2' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_STREAM_ADMIT_PASS revision=2 tiles=9 maxPerFrame=2 observed=2' /tmp/dotnet-world.log
          grep -Eq 'GODOT_CSHARP_NODE_STAGE_PASS revision=1 nodes=12 maxPerFrame=2 observed=2 maxStageMs=[0-9.]+' /tmp/dotnet-world.log
          grep -Eq 'GODOT_CSHARP_NODE_STAGE_PASS revision=2 nodes=9 maxPerFrame=2 observed=2 maxStageMs=[0-9.]+' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_NODE_ACTIVE_PASS tiles=9 whileStaging=True' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_NODE_ACTIVE_PASS tiles=12 whileStaging=True' /tmp/dotnet-world.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log = Path('/tmp/dotnet-world.log').read_text()
          rows = re.findall(r'GODOT_CSHARP_NODE_STAGE_PROGRESS revision=(\d+) added=(\d+) staged=(\d+) total=(\d+) ms=([0-9.]+)', log)
          assert len(rows)>=11, rows
          assert all(int(row[1])<=2 for row in rows), rows
          assert [int(r[0]) for r in rows].count(1)>=6 and [int(r[0]) for r in rows].count(2)>=5, rows
          assert all(float(r[4])>=0 for r in rows)
          print('GODOT_CSHARP_NODE_BUDGET_CI_PASS',len(rows),'frames')
          PY
          ! grep -Eq 'GODOT_CSHARP_(STREAM|STALE)_FAIL' /tmp/dotnet-world.log
          grep -Eq 'GODOT_CSHARP_SEAM_PASS level=1 tiles=9 edges=[0-9]+ nonmanifold=0' /tmp/dotnet-world.log
          grep -Eq 'GODOT_CSHARP_SEAM_PASS level=2 tiles=12 edges=[0-9]+ nonmanifold=0' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_CAMERA_PRIORITY_PASS selected=' /tmp/dotnet-world.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          log=Path('/tmp/dotnet-world.log').read_text()
          rows=re.findall(r'GODOT_CSHARP_NEIGHBOR_PASS level=(\d+) tiles=(\d+) inserted=(\d+) stitchedCells=(\d+) triangles=(\d+) nonmanifold=(\d+)',log)
          assert len(rows)==3,rows
          assert [(int(r[0]),int(r[1])) for r in rows]==[(1,9),(2,12),(1,9)],rows
          assert all(int(r[2])>0 and int(r[3])>0 and int(r[5])==0 for r in rows),rows
          assert all(int(r[4])<=2560 for r in rows),rows
          print('GODOT_CSHARP_NEIGHBOR_CI_PASS',rows)
          heights=re.findall(r'GODOT_CSHARP_DISPLACEMENT_PASS level=(\d+) vertices=(\d+) minHeight=(-?[0-9.]+) maxHeight=(-?[0-9.]+)',log)
          assert len(heights)==3,heights
          assert [(int(h[0])) for h in heights]==[1,2,1],heights
          assert all(int(h[1])>0 and float(h[2]) < -0.01 and float(h[3]) > 0.01 for h in heights),heights
          print('GODOT_CSHARP_DISPLACED_SEAMS_CI_PASS',heights)
          PY
          python3 - <<'PY'
          import re
          from pathlib import Path
          log=Path('/tmp/dotnet-world.log').read_text()
          rows=re.findall(r'GODOT_CSHARP_ADAPTIVE_PASS level=(\d+) tiles=(\d+) triangles=(\d+) uniformTriangles=(\d+) saved=(\d+)',log)
          assert len(rows)==3,rows
          assert [(int(r[0]),int(r[1])) for r in rows] == [(1,9),(2,12),(1,9)],rows
          assert all(int(t)>0 and int(s)==int(u)-int(t) and int(s)>0 for _,_,t,u,s in rows),rows
          assert max(int(t) for _,_,t,_,_ in rows)<50000
          print('GODOT_CSHARP_ADAPTIVE_CI_PASS',rows)
          PY
          grep -q 'GODOT_CSHARP_LOD_SWAP_PASS expanded=True tiles=12 collisionBodies=12' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_LOD_SWAP_PASS expanded=False tiles=9 collisionBodies=9' /tmp/dotnet-world.log
          grep -q 'GODOT_CSHARP_COLLISION_PASS' /tmp/dotnet-world.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:|GODOT_CSHARP_.*FAIL' /tmp/dotnet-world.log
      - name: Real 960x640 framebuffer capture (software GL; not GPU FPS)
        shell: bash
        run: |
          set -euo pipefail
          timeout 120s xvfb-run --auto-servernum env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GODOT_BIN" --path native-csharp/GodotWorldMapStudy \
            --rendering-driver opengl3 --audio-driver Dummy \
            --quit-after 220 -- --capture 2>&1 | tee /tmp/dotnet-capture.log
          grep -q 'GODOT_CSHARP_FRAME_CAPTURE:' /tmp/dotnet-capture.log
          grep -q 'GODOT_CSHARP_FRAME_PIXELS_PASS foreground_samples=' /tmp/dotnet-capture.log
          ! grep -Eq 'SCRIPT ERROR|SHADER ERROR|Parse Error|ERROR:|GODOT_CSHARP_CAPTURE_FAIL' /tmp/dotnet-capture.log
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path('native-csharp/GodotWorldMapStudy/evidence/planet-debug.png')
          data = p.read_bytes()
          assert data[:8] == b'\x89PNG\r\n\x1a\n'
          assert struct.unpack('>II', data[16:24]) == (960, 640)
          assert len(data) > 10000, len(data)
          print('GODOT_CSHARP_CAPTURE_PNG_PASS 960x640',len(data),'bytes')
          PY
      - name: Preserve native graphical artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-godot-net-worldmap-frame
          path: native-csharp/GodotWorldMapStudy/evidence/planet-debug.png
          if-no-files-found: warn
          retention-days: 7
